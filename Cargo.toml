# ─────────────────────────────────────────────────────────────────────────────
# Root package — Renzora-style. `cargo run` from workspace root launches game.
# Real assembly lives in the `forgia-game` library crate.
# ─────────────────────────────────────────────────────────────────────────────
[package]
name = "forgia"
version = "0.1.0"
edition = "2021"
description = "Forgia V2 — YouTube of gaming. Play / Build / Edit funnel."

[lints]
workspace = true

[dependencies]
forgia-game = { path = "crates/forgia-game" }
# Story-592 (M0.4) : panic hook -> forgia2_crash.json (echappement JSON correct).
serde_json = { workspace = true }

[[bin]]
name = "forgia"
path = "src/main.rs"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 4

