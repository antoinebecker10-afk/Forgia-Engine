# Lints workspace — inherited by each crate via [lints] workspace = true
# Stricter than V1 from day 1 : 0 dead_code tolerated, 0 hardcode in gameplay paths.
[workspace.lints.clippy]
needless_collect = "warn"
redundant_clone = "warn"
unnecessary_cast = "warn"
needless_borrow = "warn"
cast_lossless = "warn"
doc_overindented_list_items = "warn"
explicit_iter_loop = "warn"
match_wildcard_for_single_variants = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
single_match_else = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# Story-516+ : ces 3 lints sont legit en tests/sanity-checks, on garde explicites
assertions_on_constants = "allow"
field_reassign_with_default = "allow"
manual_range_contains = "allow"

[workspace.lints.rust]
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"

[workspace.dependencies]
# Pin Bevy 0.18.1 stable until V1 ship. Migration 0.19+ post-ship V1.1.
bevy = { version = "0.18.1", features = ["wav", "mp3", "vorbis", "jpeg", "bevy_dev_tools", "ktx2", "basis-universal", "webp", "file_watcher"] }
bevy_rapier3d = { version = "0.33", features = ["debug-render-3d"] }
bevy_egui = "0.39.1"
bevy_hanabi = { version = "0.18", default-features = false, features = ["3d"] }
bevy_kira_audio = "0.25"
leafwing-input-manager = "0.20"

# Terrain (port verbatim V1 forgia-terrain — DAG-libre)
noise = "0.9"
fast-surface-nets = "0.2.1"
ndshape = "0.3"
voronoice = "0.2"
rayon = "1"
zstd = "0.13"

# Procgen — spatial index pour validation building-vs-road (story-446)
rstar = "0.12"

# Common
sentry = "0.34"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ron = "0.8"
thiserror = "2.0"
ulid = { version = "1.1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

