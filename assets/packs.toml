# Forgia — Asset Pack Manifest
#
# Pattern : Cargo.lock adapté aux packs CC0 externes. Voir story-449.
# Le contenu (assets/models-v1/packs/<install_dir>/) est gitignored.
# Le lockfile assets/packs.lock pinne les SHA256 réels (committed).
#
# Pour installer un pack :
#   cargo run -p forgia-asset-cdn --bin forgia-pack-cdn install <name>
#
# Pour vérifier l'intégrité après install :
#   cargo run -p forgia-asset-cdn --bin forgia-pack-cdn verify <name>
#
# Phase 1 note : download_url + sha256 doivent être renseignés AVANT install.
# KayKit packs nécessitent itch.io login → télécharger manuellement, puis :
#   cargo run -p forgia-asset-cdn --bin forgia-pack-cdn hash <chemin/vers/pack.zip>
# Copier la sortie SHA256 dans le champ sha256 ci-dessous + remplacer
# download_url par l'URL directe du .zip (visible dans devtools réseau itch).

[meta]
schema_version = 1
default_install_root = "assets/models-v1/packs"

# ── KayKit (kaylousberg.itch.io) ────────────────────────────────────────────
# 9 packs CC0 distribués via itch.io. download_url à compléter manuellement
# (itch.io ne donne pas d'URL stable publique sans butler).

