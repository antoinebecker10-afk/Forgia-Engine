# Template skeleton Humanoid Vitruvian — 20 bones (avec hand_L/R)
# Source de vérité pour `forgia-skeleton-template::SkeletonTemplate`.
# Hot-reloadable via Bevy AssetServer (Shift+F12).
#
# Position normalisée : `pos = [x, y, z]` où y∈[0,1] (0=sol mesh, 1=top mesh),
# x latéral (±), z avant/arrière (±). Scalé par mesh_height au runtime.
#
# `parent` = index du bone parent dans cette liste (0-indexed). Omis = root.
# `class`  = classification anatomique déclarative (story-481) :
#            "spine" | "head" | "arm" | "leg" | "tail" | "other"
#            Consommé par embedder (locks YXZ) + rescale (Y mapping par chaîne).

