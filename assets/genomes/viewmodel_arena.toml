# Forgia V2 — Viewmodel Arena Genome
# Configuration des 4 armes V1 Arena (hot-reload via Bevy Asset).
#
# Mapping :
#   Digit1 (ModernAR)     → pepin
#   Digit2 (AssaultRifle) → bourrasque
#   Digit3 (Shotgun)      → madame_lenoir
#   Digit4 (RocketLauncher)→ boucherie
#
# Assets : assets/models/weapons/forgia/{pepin,bourrasque,madame_lenoir,boucherie}.glb

[weapons.pepin]
# Slot 1 (Digit1) — Gun (pistolet semi-auto) — Pépin
target_size = 1.10
offset_x = 0.22
offset_y = -0.35
offset_z = -1.30
rotation_x_deg = 0.0
rotation_y_deg = -90.0
rotation_z_deg = 0.0
hipfire_tilt_y_deg = 5.0
fallback_scale = 1.0
barrel_length = 0.55
ads_offset_x = 0.05
ads_offset_y = -0.40           # ★ abaissé pour que crosshair soit au-dessus du mesh
ads_offset_z = -0.80
ads_fov_deg = 30.0
sight_local_x = 0.0
sight_local_y = 0.0
sight_local_z = 0.0
sight_distance = 0.40
ads_move_speed_factor = 0.75  # gun = pénalité légère
scope_glass_alpha_ads = 0.20
# ADS visibility & feel (Phase E 2026-05-18)
ads_viewmodel_fade_alpha = 0.40   # body semi-transparent → voit cible derrière canon
ads_mouse_sensitivity_factor = 0.70  # précision moyenne (semi-auto pistolet)
# Fire behavior — Pistolet semi-auto Pépin
# TTK Overwatch : body 4 shots (0.57s) / head 2 shots (0.29s) — DPS 168 polyvalent
fire_mode = "semi"
burst_count = 0
damage = 28.0           # bump 25→28 (cohérence vs SMG 16)
fire_rate = 6.0
range = 80.0
pellets = 1
spread_deg = 0.0
sniper_scope_fullscreen = false
# Phase F — TTK balance Overwatch
head_damage_mul = 2.0          # ★ 2x headshot
damage_falloff_start = 30.0    # full damage 0-30m
damage_falloff_end = 80.0      # min damage 80m+
damage_falloff_min = 0.60      # -40% au-delà 80m
# Phase G — Juice AAA-safe per Pépin (semi pistolet, gunfeel moderne) — softening v2
shake_trauma = 0.03            # ← 0.06→0.03 (moitié)
recoil_pitch_deg = 0.25        # ← 0.5→0.25 (moitié)
recoil_yaw_random_deg = 0.05   # ← 0.12→0.05 (très subtil)
fov_punch_deg = 0.0            # ★ SKIP (CS2 philosophy — semi-auto)
# Phase H — ADS scale shrink (gun plus petit en ADS = crosshair visible)
ads_scale_factor = 0.70        # -30% taille en full ADS

[weapons.bourrasque]
# Slot 2 (Digit2) — Mitraillette (SMG full-auto cadence rapide) — Bourrasque
target_size = 1.10
offset_x = 0.22
offset_y = -0.35
offset_z = -1.30
rotation_x_deg = 0.0
rotation_y_deg = -90.0
rotation_z_deg = 0.0
hipfire_tilt_y_deg = 5.0
fallback_scale = 1.0
barrel_length = 0.55
ads_offset_x = 0.05
ads_offset_y = -0.40           # ★ abaissé pour que crosshair soit au-dessus du mesh
ads_offset_z = -0.80
ads_fov_deg = 32.0
sight_local_x = 0.0
sight_local_y = 0.0
sight_local_z = 0.0
sight_distance = 0.40
ads_move_speed_factor = 0.70
scope_glass_alpha_ads = 0.20
# ADS visibility & feel (Phase E 2026-05-18)
ads_viewmodel_fade_alpha = 0.40   # body semi-transparent SMG
ads_mouse_sensitivity_factor = 0.70  # cadence rapide, précision moyenne
# Fire behavior — SMG full-auto Bourrasque
# TTK Overwatch : body 7 shots @16/s = 0.44s / head 5 shots = 0.31s — DPS 256 (★ #1 sustained)
fire_mode = "auto"
burst_count = 0
damage = 16.0           # ★ bump 12→16 per-shot plus impactful (audit user 2026-05-18)
fire_rate = 16.0        # 16 shots/s ultra rapid
range = 50.0
pellets = 1
spread_deg = 1.5        # léger spread (recul)
sniper_scope_fullscreen = false
# Phase F — TTK balance Overwatch (SMG = close-mid range)
head_damage_mul = 1.5          # ★ 1.5x headshot
damage_falloff_start = 15.0    # full damage 0-15m
damage_falloff_end = 40.0      # min damage 40m+
damage_falloff_min = 0.40      # -60% au-delà 40m (SMG punished long range)
# Phase G — Juice AAA-safe per Bourrasque (full-auto = MINIMAL shake anti eye-strain)
# Softening v2 : user feedback 2026-05-18 "16Hz × yaw random = mal aux yeux"
shake_trauma = 0.015           # ★ ULTRA léger (16/s × 0.015 = steady ~0.03 trauma)
recoil_pitch_deg = 0.12        # ← 0.25→0.12 (kick visuel minimal)
recoil_yaw_random_deg = 0.0    # ★ ZERO yaw : tue le wobble horizontal à 16Hz
fov_punch_deg = 0.0            # ★ SKIP (CS2 — pas de fov punch en auto-fire)
# Phase H — ADS scale shrink (SMG cadence rapide = besoin crosshair visible)
ads_scale_factor = 0.65        # -35% taille en full ADS

[weapons.madame_lenoir]
# Slot 3 (Digit3) — Sniper (semi-auto, one-shot, scope fullscreen) — Madame Lenoir
# Meshy axis : +X local (vs -X pour Pepin/Bourrasque). R_y(+90)·(+1,0,0)=(0,0,-1) forward.
target_size = 1.20
offset_x = 0.25
offset_y = -0.40
offset_z = -1.30
rotation_x_deg = 0.0
rotation_y_deg = 90.0
rotation_z_deg = 0.0
hipfire_tilt_y_deg = 5.0
fallback_scale = 1.0
barrel_length = 0.65   # canon long sniper
ads_offset_x = 0.0
ads_offset_y = -0.20
ads_offset_z = -0.85
ads_fov_deg = 10.0      # ULTRA zoom sniper (~4-5x)
sight_local_x = 0.0
sight_local_y = 0.0
sight_local_z = 0.0
sight_distance = 0.40
ads_move_speed_factor = 0.35  # sniper très pénalisé en visée
scope_glass_alpha_ads = 0.10  # scope très see-through (sniper precise)
# ADS visibility & feel (Phase E 2026-05-18)
ads_viewmodel_fade_alpha = 1.00   # ★ pas de body fade (scope fullscreen overlay cache déjà)
ads_mouse_sensitivity_factor = 0.30  # ★ ultra-lent précision sniper
# Fire behavior — Sniper Madame Lenoir
# TTK Overwatch : head 1-shot (100hp) / body 2 shots (50dmg×2)
fire_mode = "semi"
burst_count = 0
damage = 50.0          # ★ base body. ×2 head = 100 = one-shot head
fire_rate = 0.8        # ~1 tir / 1.25s
range = 300.0
pellets = 1
spread_deg = 0.0       # precision absolute
sniper_scope_fullscreen = true   # ★ active overlay fullscreen ADS
# Phase F — TTK balance Overwatch (sniper = no falloff, headshot insta-kill)
head_damage_mul = 2.0          # ★ head one-shot
damage_falloff_start = 300.0   # pas de falloff
damage_falloff_end = 300.0
damage_falloff_min = 1.00      # 100% damage all range
# Phase G — Juice AAA-safe per Lenoir (sniper one-big-kick + recovery) — softening v2
shake_trauma = 0.12            # ← 0.18→0.12 (~0.8° peak, decay 100ms)
recoil_pitch_deg = 1.2         # ← 1.8→1.2 (kick puissant mais pas brutal)
recoil_yaw_random_deg = 0.0    # ★ pas de yaw : sniper = précision absolue
fov_punch_deg = 0.5            # ← 0.8→0.5 (subtle weight feel, CS2 AWP-lite)
# Phase H — ADS scale shrink (sniper = PAS de changement, scope overlay cache déjà)
ads_scale_factor = 1.00        # ★ inchangé (sniper a son scope fullscreen)

[weapons.boucherie]
# Slot 4 (Digit4) — Fusil à pompe (pump-action multi-pellets cone) — Boucherie
# Meshy axis : +Z local (vs -X autres). R_y(180)·(0,0,1)=(0,0,-1) forward.
target_size = 1.20
offset_x = 0.28
offset_y = -0.40
offset_z = -1.30
rotation_x_deg = 0.0
rotation_y_deg = 180.0
rotation_z_deg = 0.0
hipfire_tilt_y_deg = 5.0
fallback_scale = 1.0
barrel_length = 0.55
ads_offset_x = 0.05
ads_offset_y = -0.50           # ★ abaissé encore plus (shotgun large mesh)
ads_offset_z = -0.85
ads_fov_deg = 35.0      # Shotgun zoom modéré
sight_local_x = 0.0
sight_local_y = 0.0
sight_local_z = 0.0
sight_distance = 0.45
ads_move_speed_factor = 0.65
scope_glass_alpha_ads = 0.30
# ADS visibility & feel (Phase E 2026-05-18)
ads_viewmodel_fade_alpha = 0.30   # body très transparent (pas d'iron sight précis)
ads_mouse_sensitivity_factor = 0.85  # cone spread = pas besoin précision fine
# Fire behavior — Shotgun pump Boucherie
# TTK Overwatch/Fortnite : 1-shot kill close (≤8m) / 3-4 shots à 25m
# 8 pellets × 18 = 144 dmg close (over-kill 100hp) / × 0.2 falloff = 28.8 dmg long range
fire_mode = "pump"      # semi-auto avec pause pump (V1 = simple semi)
burst_count = 0
damage = 18.0          # ★ +50% per pellet : 8×18=144 close (one-shot guaranteed)
fire_rate = 1.2        # 1 tir / 0.83s
range = 40.0           # ★ étendu (pellets continuent en falloff au-delà 8m)
pellets = 8            # ★ cone 8 pellets
spread_deg = 8.0       # ★ spread cone large shotgun
sniper_scope_fullscreen = false
# Phase F — TTK balance Fortnite (shotgun = devastating close, useless long)
head_damage_mul = 1.2          # léger bonus head (pas focus shotgun)
damage_falloff_start = 8.0     # full damage 0-8m (one-shot kill)
damage_falloff_end = 25.0      # min damage 25m+
damage_falloff_min = 0.20      # ★ -80% : 8×18×0.2 = 28.8 long range (~4 hits)
# Phase G — Juice AAA-safe per Boucherie (shotgun gros poids) — softening v2
shake_trauma = 0.15            # ← 0.22→0.15 (~1° peak, decay 100ms)
recoil_pitch_deg = 1.4         # ← 2.0→1.4 (kick lourd mais pas violent)
recoil_yaw_random_deg = 0.12   # ← 0.30→0.12 (mini cone visuel)
fov_punch_deg = 0.8            # ← 1.2→0.8 (Fortnite pump-lite)
# Phase H — ADS scale shrink (shotgun gros mesh = shrink agressif)
ads_scale_factor = 0.60        # -40% taille en full ADS (mesh le plus volumineux)
