# === Hit-Stop (story-432 V2 — gunfeel framework) ===
# Pause virtuelle gameplay (Time<Virtual>) sur impact lourd. Migration des
# hardcodes de combat_juice.rs (was 50ms / threshold 20 / scale 0.0).
[[genes]]
id = "wfx_hit_stop_ms"
label = "Hit-Stop Duration (ms)"
chromosome = "GunfeelImpact"
target = "Value"
min = 0.0
max = 200.0
# 2026-07-20 — hitstop DESACTIVE (demande user : micro-freezes ressentis en tir
# soutenu = le hitstop par-hit, invisible aux capteurs frame-time). Was 50.0.
# Pour re-tuner : paliers crit/kill dans roguelite_gamefeel.toml.
default = 0.0
layer = "hit_stop"

[[genes]]
id = "wfx_hit_stop_threshold_dmg"
label = "Hit-Stop Threshold (dmg)"
chromosome = "GunfeelImpact"
target = "Value"
min = 5.0
max = 100.0
default = 20.0
layer = "hit_stop"

[[genes]]
id = "wfx_hit_stop_scale"
label = "Hit-Stop Time Scale"
chromosome = "GunfeelImpact"
target = "Value"
min = 0.0
max = 0.5
default = 0.0
layer = "hit_stop"

# === Camera Recoil (story-432 V2 — distinct from viewmodel kick) ===
# Apex/COD pattern : pitch push haut + yaw petit random, recover spring.
# Modifie CameraState.pitch/yaw + dette compensée par decay (auto-recenter).
[[genes]]
id = "wfx_cam_kick_pitch_deg"
label = "Camera Pitch Kick (deg)"
chromosome = "GunfeelRecoil"
target = "Value"
min = 0.0
max = 5.0
default = 1.2
layer = "cam_recoil"

[[genes]]
id = "wfx_cam_kick_yaw_max_deg"
label = "Camera Yaw Kick Max (deg)"
chromosome = "GunfeelRecoil"
target = "Value"
min = 0.0
max = 2.0
default = 0.4
layer = "cam_recoil"

[[genes]]
id = "wfx_cam_recover_hz"
label = "Camera Recoil Recover Rate"
chromosome = "GunfeelRecoil"
target = "Value"
min = 5.0
max = 40.0
default = 18.0
layer = "cam_recoil"

# === Damage Falloff (story-432 V5-D — gunfeel TTK skill) ===
# Hitscan damage scaling avec distance. start_pct = fraction du range max
# avant que falloff commence (0.5 = 50% range = full dmg, 100% range = floor).
# floor_mult = multiplicateur damage au range max (Apex 0.65, Halo 0.7).
[[genes]]
id = "wfx_falloff_start_pct"
label = "Damage Falloff Start (% range)"
chromosome = "Ballistics"
target = "Value"
min = 0.1
max = 1.0
default = 0.5
layer = "falloff"

[[genes]]
id = "wfx_falloff_floor_mult"
label = "Damage Floor at Max Range"
chromosome = "Ballistics"
target = "Value"
min = 0.2
max = 1.0
default = 0.65
layer = "falloff"

