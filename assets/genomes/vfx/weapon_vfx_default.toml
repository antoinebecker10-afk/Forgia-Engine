id = "weapon_vfx_default"
name = "Weapon Visual Effects"
domain = "Combat"
category = "VFX"
description = "Hitscan weapon VFX: muzzle flash, impact sparks, tracers, screen shake"
version = "1.0.0"

# Screen Shake
[[genes]]
id = "wfx_fire_shake"
label = "Fire Shake"
chromosome = "ScreenShake"
target = "Value"
min = 0.0
max = 0.5
default = 0.12
layer = "shake"

