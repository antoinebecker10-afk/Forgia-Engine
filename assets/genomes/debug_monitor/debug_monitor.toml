# ═══════════════════════════════════════════════════════════════════════════════
# COMBAT HEALTH CHECKS — Story-412 (2026-05-06)
# Connecte les 4 flags du sensor forgia_combat.json existant + 2 invariants
# additionnels (spell registry, projectile flood) au HealthMonitor. Le sensor
# ecrivait deja les flags, personne ne les surveillait. Resout le trou identifie
# par audit modules post-story-411.
# ═══════════════════════════════════════════════════════════════════════════════

# NOTE UNITE TICKS — Tous les `dbg_combat_*_streak` se mesurent en ticks du
# `combat_snapshot_system`, qui tourne a `dbg_json_export_interval` (default
# 2.0 s). Wall-clock effectif = streak * json_export_interval. Exemple :
# streak=30 a interval=2s => alerte fire apres ~60 s de condition sustained.
# Si l'operateur change `dbg_json_export_interval`, les wall-clocks decales.
# 0 = check desactive (genome opt-out).

[[genes]]
id = "dbg_combat_orphan_streak"
label = "Combat VFX Orphan Streak (ticks)"
chromosome = "CombatDebug"
target = "Value"
min = 0.0
max = 600.0
default = 30.0
layer = "global"
# Ticks consecutifs ou fireball_vfx_orphan ou icebolt_vfx_orphan = true.
# 30 ticks * json_export_interval (2.0s default) = ~60s wall-clock. Tolere
# 1 frame de delai spawn projectile/VFX (deja code dans combat_flags).

[[genes]]
id = "dbg_combat_shield_missing_streak"
label = "Combat Shield VFX Missing Streak (ticks)"
chromosome = "CombatDebug"
target = "Value"
min = 0.0
max = 600.0
default = 30.0
layer = "global"
# Ticks ou shield_vfx_missing=true (shield actif mais 0 mesh visuel). Glitch
# spawn ShieldMesh detectable par cette divergence soutenue.
# 30 ticks * 2s = ~60s wall-clock default.

[[genes]]
id = "dbg_combat_impact_leak_streak"
label = "Combat Impact Leak Streak (ticks)"
chromosome = "CombatDebug"
target = "Value"
min = 0.0
max = 100.0
default = 5.0
layer = "global"
# Ticks ou impact_leak=true (>50 ImpactEffect actifs). 5 ticks * 2s = ~10s
# wall-clock — reactif car 50+ impacts = pool leak certain (despawn casse).

[[genes]]
id = "dbg_combat_spell_reg_grace_secs"
label = "Combat Spell Registry Boot Grace (s)"
chromosome = "CombatDebug"
target = "Value"
min = 5.0
max = 300.0
default = 30.0
layer = "global"
# Secondes wall-clock post-boot pendant lesquelles le streak
# `spell_reg_missing_streak` n'incremente PAS. Protege contre le faux positif
# cold boot (registry inseree par systeme startup tardif). Combine avec
# `dbg_combat_spell_reg_missing_streak` pour la double-garde (BUG-412-B fix).

[[genes]]
id = "dbg_combat_spell_reg_missing_streak"
label = "Combat Spell Registry Missing Streak (ticks)"
chromosome = "CombatDebug"
