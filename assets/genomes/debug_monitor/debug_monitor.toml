chromosome = "NetworkDebug"
target = "Value"
min = 0.0
max = 100.0
default = 3.0
layer = "global"
# Ticks ou |delta| > drift_max sustained. 3 * 2s = ~6s — un map_switch
# legitime fait spike 1-2 ticks au plus.

[[genes]]
