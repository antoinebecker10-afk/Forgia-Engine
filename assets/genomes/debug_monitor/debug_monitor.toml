# ═══════════════════════════════════════════════════════════════════════════════
# CONSTRAINTS — ensure thresholds stay coherent
# ═══════════════════════════════════════════════════════════════════════════════

# Critical must be ≤ Warning
[[constraints]]
source = "dbg_fps_warning"
target = "dbg_fps_critical"
ratio = 0.5

# Unplayable must be ≤ Critical
[[constraints]]
source = "dbg_fps_critical"
target = "dbg_fps_unplayable"
ratio = 0.33

# Guardian throttle must be ≤ reduce
[[constraints]]
source = "dbg_guardian_reduce_fps"
target = "dbg_guardian_throttle_fps"
ratio = 0.67

