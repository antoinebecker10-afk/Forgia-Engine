chromosome = "NetworkDebug"
target = "Value"
min = 0.0
max = 600.0
default = 30.0
layer = "global"
# Ticks ou role=Host + connected + 0 remote_players sustained = lobby
# fantome (host attend des clients qui n'arrivent pas). 30 * 2s = ~60s.

