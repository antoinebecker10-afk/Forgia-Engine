# ═══════════════════════════════════════════════════════════════════════════════
# UI DEBUG COMPLETION — Story-411 (2026-05-06)
# V1 invariants cross-module + V2 perf egui + V3 snapshot on-demand.
# Inspiration : Unreal Slate Widget Reflector + Unity UI Toolkit Debugger +
# bevy-inspector-egui. Comble le gap observabilite UI vs terrain (audit 2026-05-06).
# ═══════════════════════════════════════════════════════════════════════════════

# ── V1 invariants cross-module (4 health checks) ─────────────────────────────

[[genes]]
id = "dbg_blocker_orphan_streak"
label = "Input Blocker Orphan Streak (ticks)"
chromosome = "UiDebug"
target = "Value"
min = 0.0
max = 600.0
default = 30.0
layer = "global"
# Ticks consecutifs ou block_keyboard_shortcuts=true mais aucun panel ouvert detecte.
# > 30 (~6s a 5Hz) = blocker orphelin = clavier mort apres fermeture panel. 0 = check off.

[[genes]]
id = "dbg_cursor_drift_streak"
