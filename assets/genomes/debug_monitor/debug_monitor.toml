# NETWORK OBSERVABILITY — Story-414 (2026-05-06)
# Connecte les flags du sensor forgia_network.json existant (story-331) au
# HealthMonitor. Le flag `client_disconnected_unexpectedly` est calcule depuis
# story-349 mais aucun health check ne le lit. 4 checks (CHECK 71-74).
#
# NOTE UNITE TICKS — `dbg_network_*_streak` se mesurent en ticks du
# `network_snapshot_system` qui tourne a `dbg_json_export_interval`
# (default 2.0 s). Wall-clock = streak * json_export_interval.
# `dbg_network_*_secs` sont en wall-clock direct.
# 0 = check desactive.
# ═══════════════════════════════════════════════════════════════════════════════

[[genes]]
id = "dbg_network_disconnect_streak"
label = "Network Client Disconnect Streak (ticks)"
chromosome = "NetworkDebug"
target = "Value"
min = 0.0
max = 100.0
default = 5.0
layer = "global"
# Ticks consecutifs ou client_disconnected_unexpectedly=true. Le sensor
# applique deja un seuil sentinel 10s (cf. client_disconnected_unexpectedly
# helper) avant de set le flag — ce streak est une 2e garde contre flap
# transient (network blip <2s). 5 * 2s = ~10s wall-clock additionnel.

[[genes]]
id = "dbg_network_disconnect_warn_secs"
label = "Network Disconnect Warn Threshold (s)"
chromosome = "NetworkDebug"
target = "Value"
min = 5.0
max = 600.0
default = 30.0
layer = "global"
# time_disconnected_secs > seuil = warning. 30s = client a probablement
# perdu sa session, le serveur ne va pas l'attendre eternellement.

[[genes]]
id = "dbg_network_disconnect_critical_secs"
label = "Network Disconnect Critical Threshold (s)"
chromosome = "NetworkDebug"
target = "Value"
min = 30.0
max = 3600.0
default = 120.0
layer = "global"
# time_disconnected_secs > seuil = critical. 2 min = certainement perdu,
# le client devrait avoir abandonne ou relance le matchmaking.

[[genes]]
id = "dbg_network_sync_drift_max"
