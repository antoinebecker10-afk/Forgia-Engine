# ═══════════════════════════════════════════════════════════════════════════
# Health / Diagnostic
# ═══════════════════════════════════════════════════════════════════════════

[[rule]]
metric = "health.critical_alert_count"
severity = "critical"
description = "Health monitor signale critical alerts — investigation immédiate"
detector = { type = "threshold", min = 1.0 }

[[rule]]
metric = "diag.critical_issues"
severity = "critical"
description = "Diagnostic 360° flag critical issues"
detector = { type = "threshold", min = 1.0 }

[[rule]]
metric = "last_state.freeze_risk"
severity = "minor"
description = "Freeze risk précurseur (gen+mesh+castle pending && frame_ms>30)"
detector = { type = "threshold", min = 1.0 }

[[rule]]
metric = "sensor_health.stale"
severity = "minor"
description = "Meta-sensor : ≥3 sensors stale — chaîne observability rompue"
detector = { type = "threshold", max = 3.0 }

[[rule]]
metric = "a11y.low_fps_sustained_s"
severity = "major"
description = "FPS < 30 sustained > 30s — accessibility regression"
detector = { type = "cusum", target = 0.0, threshold = 30.0 }

# ═══════════════════════════════════════════════════════════════════════════
# Crash / Determinism
# ═══════════════════════════════════════════════════════════════════════════

[[rule]]
metric = "crash_signature.has_log"
severity = "blocker"
description = "Crash log présent — panic au précédent run, BugReport(Panic) déjà émis par crash_dump"
detector = { type = "threshold", min = 1.0 }

# ═══════════════════════════════════════════════════════════════════════════
# Persistence / Save
# ═══════════════════════════════════════════════════════════════════════════

[[rule]]
metric = "persistence.time_dirty_secs"
severity = "minor"
description = "Save dirty > 5min sans autosave — risk perte données"
detector = { type = "threshold", max = 300.0 }

[[rule]]
metric = "persistence.file_exists"
severity = "minor"
description = "placed_objects.json absent (premier run OK, mais sustained = save broken)"
detector = { type = "threshold", min = 0.0 }

# ═══════════════════════════════════════════════════════════════════════════
# Network (multiplayer lightyear)
# ═══════════════════════════════════════════════════════════════════════════

[[rule]]
