# Forgia QA — Anomaly Rules (story-391 P2 W2 + W6 closure)
#
# Source de vérité : `forgia-qa-telemetry/src/config.rs` (DetectorSpec enum).
# Métriques disponibles : `docs/qa/METRICS_NAMING.md` (66 domaines, ~398 metrics).
#
# Hot-reload Shift+F12 (genome system, branchement W7) : modification de ce
# fichier sans redémarrer le jeu pour tuner les seuils en runtime.
#
# Détecteurs supportés :
# - robust_z_score      : MAD-based, défaut Forgia (Iglewicz-Hoaglin 1993)
# - welford_z_score     : gaussien strict, Welford 1962 online stable
# - ewma                : exponentially weighted moving average (IEEE 2016)
# - threshold           : seuil absolu Min/Max/Range
# - growth_rate_pattern : RESIN-inspired Microsoft Azure 2025 (leak detection)
# - cusum               : cumulative sum change-point (IEEE Ulster 2015)
#
# Sévérités : cosmetic / minor / major / critical / blocker

schema_version = 1

# ═══════════════════════════════════════════════════════════════════════════
# Performance / Frames
# ═══════════════════════════════════════════════════════════════════════════

[[rule]]
metric = "perf.frame_time_ms"
severity = "minor"
tr_ref = "TR-budget-frame-001"
description = "Frame time absolu > 33ms (en deçà de 30 FPS — accessibility threshold)"
detector = { type = "threshold", max = 33.0 }

[[rule]]
metric = "perf.frame_time_ms"
severity = "major"
tr_ref = "TR-budget-frame-001"
description = "Frame time spike Robust Z > 4.0 (MAD-based, insensible aux lag spikes ponctuels)"
detector = { type = "robust_z_score", window = 600, threshold = 4.0 }

[[rule]]
metric = "gameset.total_ms"
severity = "major"
description = "GameSet 7-step chain dépasse budget gameplay 8ms"
detector = { type = "threshold", max = 8.0 }

[[rule]]
metric = "gameset.physics_ms"
severity = "major"
tr_ref = "TR-budget-physics-001"
description = "Physics step > 4ms — Rapier suspect (collisions, joints)"
detector = { type = "threshold", max = 4.0 }

[[rule]]
metric = "lag.event_count"
severity = "major"
description = "Plus de 10 freeze events détectés sur la fenêtre"
detector = { type = "threshold", max = 10.0 }

[[rule]]
metric = "perf_guardian.flapping_detected"
severity = "minor"
description = "Perf guardian flap détecté (transitions throttle répétées) — config seuil suspecte"
detector = { type = "threshold", min = 1.0 }

# ═══════════════════════════════════════════════════════════════════════════
# Mémoire / VRAM / handles
# ═══════════════════════════════════════════════════════════════════════════

[[rule]]
metric = "vram.gpu_estimated_mb"
severity = "major"
description = "VRAM estimée > 8 GB (warning sustained pour GPU 8GB)"
detector = { type = "threshold", max = 8000.0 }

[[rule]]
metric = "vram.consecutive_danger"
severity = "critical"
description = "VRAM danger sustained 3+ checks consécutifs (auto-reduction triggered)"
detector = { type = "threshold", min = 3.0 }

[[rule]]
metric = "vram.seconds_in_emergency"
severity = "critical"
description = "VRAM emergency sustained > 60s — escalade auto-reduction critique"
detector = { type = "threshold", max = 60.0 }

[[rule]]
metric = "memory.process_total_mb"
severity = "major"
description = "RAM process drift > 0.5 MB/s sur 10min = leak (RESIN-inspired Azure 2025)"
detector = { type = "growth_rate_pattern", window_secs = 600, min_growth_per_sec = 0.5 }

[[rule]]
metric = "leak.process_memory_mb"
severity = "major"
description = "Memory leak detector growth pattern soutenu"
detector = { type = "growth_rate_pattern", window_secs = 600, min_growth_per_sec = 0.5 }

[[rule]]
metric = "handles.recent_delta_meshes"
severity = "major"
description = "Handle leak meshes — > 200 nouveaux meshes en 50s sustained"
detector = { type = "threshold", max = 200.0 }

# ═══════════════════════════════════════════════════════════════════════════
# Entités / ECS
# ═══════════════════════════════════════════════════════════════════════════

[[rule]]
metric = "entity.delta_per_sec"
severity = "major"
description = "Croissance entités > 50/s sustained = spawn loop ou leak"
detector = { type = "growth_rate_pattern", window_secs = 60, min_growth_per_sec = 50.0 }

[[rule]]
metric = "entity_breakdown.leak_suspected"
severity = "major"
description = "Heuristic entity breakdown flag leak (delta_per_sec > 50 + entities > 18000)"
detector = { type = "threshold", min = 1.0 }

[[rule]]
metric = "physics.nan_transforms"
severity = "critical"
description = "NaN transform détecté — physics explosion imminente"
detector = { type = "threshold", min = 1.0 }

[[rule]]
metric = "physics.inf_transforms"
severity = "critical"
description = "Inf transform détecté — physics explosion imminente"
detector = { type = "threshold", min = 1.0 }

# ═══════════════════════════════════════════════════════════════════════════
# Combat / NPCs
# ═══════════════════════════════════════════════════════════════════════════

[[rule]]
metric = "combat.fireballs"
severity = "minor"
description = "Plus de 100 fireballs simultanées — leak VFX ou spam attack"
detector = { type = "threshold", max = 100.0 }

[[rule]]
metric = "npcs.manager_leak_ratio"
severity = "major"
description = "NPC manager leak ratio > 30% (entities tracked mais pas alive)"
detector = { type = "threshold", max = 0.30 }

[[rule]]
metric = "vehicle.speed_nan"
severity = "critical"
description = "Vehicle speed NaN détecté — physics corruption"
detector = { type = "threshold", min = 1.0 }

# ═══════════════════════════════════════════════════════════════════════════
