[[genes]]
id = "mar_damage"
label = "Damage"
chromosome = "Ballistics"
target = "Value"
min = 5.0
max = 30.0
default = 16.0
layer = "modern_ar"

[[genes]]
id = "mar_fire_rate"
label = "Fire Rate (s)"
chromosome = "Ballistics"
target = "Value"
min = 0.05
max = 0.3
default = 0.09
layer = "modern_ar"

[[genes]]
id = "mar_range"
label = "Range (m)"
chromosome = "Ballistics"
target = "Value"
min = 40.0
max = 150.0
default = 110.0
layer = "modern_ar"

[[genes]]
id = "mar_spread_deg"
label = "Spread (deg)"
chromosome = "Ballistics"
target = "Value"
min = 0.5
max = 5.0
default = 1.8
layer = "modern_ar"

# === Handling (viewmodel / recoil / ADS) ===

