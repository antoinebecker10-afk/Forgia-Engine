# ═══════════════════════════════════════════════════════════════════════════
# LE BOURG DE L'ENCLUME — forge_sanctum authored (story-660, 2026-07-02).
# DA : place de village-forge DIURNE (kit medieval_hexagon + rochers nature) —
# température CHAUDE/claire vs Cryptes sombres roses → différenciation instantanée.
# Règles appliquées (recherche level-art 2026-07-02, rapport gunfire-like) :
#   · 1 focal point « weenie » : le BEFFROI (église ×10, 16.5m, visible partout)
#   · 70/30 : 3 clusters denses (marché SE / taverne W / ruelle NE) + lanes ouvertes
#   · centre = puits (landmark bas, combat rapproché autour)
#   · perchoir accessible en 2 marches de rochers (walkable)
# ⚠️ AABB MESURÉS (scratchpad/aabb.py) — kit medieval = MINIATURES table-top :
#   church 1.03x1.65x1.16 (×10 → r~7.5) · tavern 1.17x1.40x1.33 (×9 → r~5.6)
#   market 1.80x0.98x1.32 (×7 → r~5.5) · home_A 0.79x0.93x0.85 (×8 → r~3.3)
#   home_B 0.87x1.28x1.10 (×8 → r~3.9) · well 0.65x0.83x0.75 (×5 → r~1.8)
#   rock_medium_1 3.23x2.26x2.99 (r~1.6/scale) · rock_medium_2 3.05x1.90x2.48
# Arène extent 80m (rayon 40) — pièce la plus lointaine : beffroi z-28+r7.5 = 35.5 ✓

[layouts.forge_sanctum]
suppress_procedural_modules = true
# Story-682 — OÙ LE JOUEUR APPARAÎT.
#
# Rapporté en jeu : « je spawn dans le puits, donc je suis bloqué ». Le puits est
# à [0,0,0] avec `blocker = true` — c'est VOULU (« centre = puits, combat
# rapproché autour ») — mais l'apparition du joueur était en dur à l'origine
# pour tous les stages. Deux décisions autorées sur la même coordonnée, aucune
# ne connaissant l'autre.
#
# (0, 0, 12) : plein sud du puits, dos à la place. Le premier regard cadre le
# puits à 12 m puis le beffroi 40 m derrière — le « weenie » de la carte. Le
# blocker le plus proche après le puits est un rocher à 12,2 m.
player_spawn = [0.0, 0.0, 12.0]

