#   Mound_005/008 : r1.95, top 0.5-0.7m  → cover BAS (s'accroupir derrière)
#   Box_001       : r0.79, top 1.35m     → caisse, cover taille
#   RockMid_001   : r6.34, top 6.28m     → cover HAUT
#   RockMid_003   : r4.86, top 8.37m     → cover haut
#   Crag_001      : r5.09, top 7.74m     → cover haut
# `blocker = true` → collider TriMesh (lib.rs:1026) : le cover BLOQUE réellement.
# Props narratifs (Chest/Well/Gold) = decor non-bloquant ("foutoir d'âmes").
# ══════════════════════════════════════════════════════════════════════════════

