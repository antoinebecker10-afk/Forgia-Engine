# === Constraints ===

[[constraints]]
source = "body_height"
target = "leg_length"
ratio = 0.8

[[constraints]]
source = "body_height"
target = "arm_length"
ratio = 0.6

[[constraints]]
source = "body_width"
target = "head_size"
ratio = 0.3

# Taller body → higher eye
[[constraints]]
source = "body_height"
target = "eye_height"
ratio = 0.3

# Longer legs → faster run
[[constraints]]
source = "leg_length"
target = "run_speed"
ratio = 3.0

# Run speed → sprint speed (proportional)
[[constraints]]
source = "run_speed"
target = "sprint_speed"
ratio = 1.5

# Longer legs → better jump
[[constraints]]
source = "leg_length"
target = "jump_impulse"
ratio = 2.0
