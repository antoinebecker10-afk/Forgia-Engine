id = "wind_default"
name = "Wind System"
domain = "World"
category = "Custom"
description = "Wind direction, speed, vegetation sway, particle drift, gust patterns"
version = "1.0.0"

# === Global Wind ===
[[genes]]
id = "wind_dir_x"
label = "Wind Direction X"
chromosome = "Direction"
target = "Value"
min = -1.0
max = 1.0
default = 0.7
layer = "global"

[[genes]]
id = "wind_dir_z"
label = "Wind Direction Z"
chromosome = "Direction"
target = "Value"
min = -1.0
max = 1.0
default = 0.3
layer = "global"

[[genes]]
id = "wind_base_speed"
label = "Base Wind Speed"
chromosome = "Speed"
target = "Value"
min = 0.0
max = 20.0
default = 5.0
layer = "global"

# === Tree Sway ===
[[genes]]
id = "tree_sway_freq"
label = "Tree Sway Frequency"
chromosome = "Vegetation Sway"
target = "Value"
min = 0.1
max = 2.0
default = 0.4
layer = "sway"

[[genes]]
id = "tree_sway_angle"
label = "Tree Sway Max Angle"
chromosome = "Vegetation Sway"
target = "Value"
min = 0.005
max = 0.15
default = 0.035
layer = "sway"

[[genes]]
id = "tree_sway_layer2_mult"
label = "Tree Sway Layer 2 Mult"
chromosome = "Vegetation Sway"
target = "Value"
min = 1.0
max = 5.0
default = 2.7
layer = "sway"

[[genes]]
id = "tree_sway_layer3_mult"
label = "Tree Sway Layer 3 Mult"
chromosome = "Vegetation Sway"
target = "Value"
min = 2.0
max = 10.0
default = 5.1
layer = "sway"

# === Bush Sway ===
[[genes]]
id = "bush_sway_freq"
label = "Bush Sway Frequency"
chromosome = "Vegetation Sway"
target = "Value"
min = 0.3
max = 4.0
default = 1.2
layer = "sway"

[[genes]]
id = "bush_sway_angle"
label = "Bush Sway Max Angle"
chromosome = "Vegetation Sway"
target = "Value"
min = 0.01
max = 0.3
default = 0.07
layer = "sway"

# Constraints
[[constraints]]
source = "wind_base_speed"
target = "tree_sway_angle"
ratio = 0.005

[[constraints]]
source = "wind_base_speed"
target = "bush_sway_angle"
ratio = 0.01
