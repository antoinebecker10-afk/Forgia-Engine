id = "clouds_default"
name = "Volumetric Clouds"
domain = "Atmosphere"
category = "Custom"
description = "Volumetric 3D clouds: ray-marching, coverage, altitude, lighting, weather types"
version = "1.0.0"

# === Cloud Layer ===
[[genes]]
id = "cloud_enabled"
label = "Clouds Enabled"
chromosome = "Layer"
target = "Value"
min = 0.0
max = 1.0
default = 1.0
layer = "layer"

[[genes]]
id = "cloud_altitude_min"
label = "Cloud Base (m)"
chromosome = "Layer"
target = "Value"
min = 200.0
max = 2000.0
default = 800.0
layer = "layer"

[[genes]]
id = "cloud_altitude_max"
label = "Cloud Top (m)"
chromosome = "Layer"
target = "Value"
min = 500.0
max = 5000.0
default = 2000.0
layer = "layer"

[[genes]]
id = "cloud_coverage"
label = "Coverage (0=clear, 1=overcast)"
chromosome = "Layer"
target = "Value"
min = 0.0
max = 1.0
default = 0.45
layer = "layer"

[[genes]]
id = "cloud_density"
label = "Cloud Density"
chromosome = "Layer"
target = "Value"
min = 0.01
max = 0.5
default = 0.15
layer = "layer"

# === Ray Marching ===
[[genes]]
id = "cloud_march_steps"
label = "March Steps"
chromosome = "Quality"
target = "Value"
min = 16.0
max = 128.0
default = 48.0
layer = "quality"

[[genes]]
id = "cloud_light_steps"
label = "Light March Steps"
chromosome = "Quality"
target = "Value"
min = 4.0
max = 16.0
default = 6.0
layer = "quality"

[[genes]]
id = "cloud_temporal_blend"
label = "Temporal Reprojection"
chromosome = "Quality"
target = "Value"
min = 0.0
max = 0.98
default = 0.9
layer = "quality"

# === Noise Shape ===
[[genes]]
id = "cloud_noise_scale"
label = "Noise Scale"
chromosome = "Shape"
target = "Value"
min = 0.0001
max = 0.005
default = 0.001
layer = "shape"

[[genes]]
id = "cloud_detail_scale"
label = "Detail Noise Scale"
chromosome = "Shape"
target = "Value"
min = 0.001
max = 0.02
default = 0.005
layer = "shape"

[[genes]]
id = "cloud_detail_weight"
label = "Detail Weight"
chromosome = "Shape"
target = "Value"
min = 0.0
max = 0.5
default = 0.2
layer = "shape"

[[genes]]
id = "cloud_wind_speed"
label = "Cloud Wind Speed"
chromosome = "Shape"
target = "Value"
min = 0.0
max = 50.0
default = 8.0
layer = "shape"

[[genes]]
id = "cloud_wind_dir_x"
label = "Wind Dir X"
chromosome = "Shape"
target = "Value"
min = -1.0
max = 1.0
default = 0.7
layer = "shape"

[[genes]]
id = "cloud_wind_dir_z"
label = "Wind Dir Z"
chromosome = "Shape"
target = "Value"
min = -1.0
max = 1.0
default = 0.3
layer = "shape"

# === Lighting ===
[[genes]]
id = "cloud_scatter_forward"
label = "Forward Scatter (silver lining)"
chromosome = "Lighting"
target = "Value"
min = 0.0
max = 1.0
default = 0.7
layer = "lighting"

[[genes]]
id = "cloud_scatter_back"
label = "Back Scatter"
chromosome = "Lighting"
target = "Value"
min = 0.0
max = 0.5
default = 0.15
layer = "lighting"

[[genes]]
id = "cloud_ambient_mult"
label = "Ambient Light Mult"
chromosome = "Lighting"
target = "Value"
min = 0.0
max = 2.0
default = 0.6
layer = "lighting"

[[genes]]
id = "cloud_sun_color_influence"
label = "Sun Color Influence"
chromosome = "Lighting"
target = "Value"
min = 0.0
max = 1.0
default = 0.8
layer = "lighting"

[[genes]]
id = "cloud_shadow_intensity"
label = "Cloud Shadow on Ground"
chromosome = "Lighting"
target = "Value"
min = 0.0
max = 1.0
default = 0.5
layer = "lighting"

# === Per-Biome Cloud Coverage Override ===
[[genes]]
id = "cloud_cov_desert"
label = "Desert Cloud Coverage"
chromosome = "BiomeClouds"
target = "Value"
min = 0.0
max = 1.0
default = 0.1
layer = "biome_clouds"

[[genes]]
id = "cloud_cov_forest"
label = "Forest Cloud Coverage"
chromosome = "BiomeClouds"
target = "Value"
min = 0.0
max = 1.0
default = 0.5
layer = "biome_clouds"

[[genes]]
id = "cloud_cov_jungle"
label = "Jungle Cloud Coverage"
chromosome = "BiomeClouds"
target = "Value"
min = 0.0
max = 1.0
default = 0.65
layer = "biome_clouds"

[[genes]]
id = "cloud_cov_tundra"
label = "Tundra Cloud Coverage"
chromosome = "BiomeClouds"
target = "Value"
min = 0.0
max = 1.0
default = 0.55
layer = "biome_clouds"

[[genes]]
id = "cloud_cov_volcanic"
label = "Volcanic Cloud Coverage"
chromosome = "BiomeClouds"
target = "Value"
min = 0.0
max = 1.0
default = 0.7
layer = "biome_clouds"

[[genes]]
id = "cloud_cov_swamp"
label = "Swamp Cloud Coverage"
chromosome = "BiomeClouds"
target = "Value"
min = 0.0
max = 1.0
default = 0.6
layer = "biome_clouds"

# Constraints
[[constraints]]
source = "cloud_coverage"
target = "cloud_density"
ratio = 0.3

[[constraints]]
source = "cloud_march_steps"
target = "cloud_light_steps"
ratio = 0.1
