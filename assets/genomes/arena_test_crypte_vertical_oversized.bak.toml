# Arena Test — « Les Cryptes verticales ». Greybox PvE roguelite.
#
# ⚠️ ÉTAPE GREYBOX. On juge la FORME, pas l'art. Primitives grises uniquement.
# SOURCE DE VÉRITÉ de la carte : le Rust n'a aucune coordonnée en dur.
# Hot-reload : sauvegarder ce fichier reconstruit la carte à la volée.
#
# ── Structure ─────────────────────────────────────────────────────────
#   entrée (départ, couvert)
#      ├── terrasse (combat, ciel ouvert, +4)  ─┐
#      ├── tunnel   (contournement, couvert)   ─┤→ cour (combat) → pont → chapelle (boss)
#      └── ruines   (récompense, ciel ouvert)  ─┘
# Trois routes depuis le départ, convergence, puis goulot final : c'est la forme
# canonique du roguelite (Hadès, Returnal, Gunfire Reborn).
#
# ── Ce que la passe « donjon » a changé ──────────────────────────────────
# AVANT : un sol de 224 × 148 m et 6 murs. On pouvait marcher partout, donc les
# routes ne servaient à rien — le graphe était décoratif.
# APRÈS : CARVING EN ESPACE NÉGATIF. Tout ce qui n'est ni salle ni couloir est de
# la ROCHE PLEINE. 43 % de la surface reste ouverte, le reste est massif. Le
# graphe devient physique : pour aller d'une salle à l'autre il FAUT prendre une
# route. C'est ce qui distingue un donjon d'un terrain vague avec des estrades.
#
# ── Alternance clos / ouvert ────────────────────────────────────────
# Une enfilade entièrement fermée étouffe ; une carte entièrement ouverte n'est
# plus un donjon. Départ et boss sont couverts (on entre dans quelque chose, on
# finit dans une nef), le tunnel est un boyau, et terrasse / ruines / cour / pont
# respirent à ciel ouvert. Toute salle couverte est éclairée : une dalle arrête
# le soleil directionnel, et une salle non éclairée est NOIRE.
#
# Convention : `pos` = centre de l'EMPREINTE AU SOL, la boîte monte de `pos.y`
# à `pos.y + size[1]`. Repère Bevy Y-up, angles en degrés.

[metrics]
player_height_m = 2
player_radius_m = 0.3
eye_height_m = 1.7
walk_speed_ms = 6.5
sprint_speed_ms = 9.75
jump_velocity_ms = 6.5
gravity_ms2 = 18
jump_height_m = 1.174
air_time_s = 0.722
jump_reach_walk_m = 4.69
jump_reach_sprint_m = 7.04
engagement_close_m = 6.5
engagement_core_m = 26
engagement_sniper_m = 52

[grid]
module_m = 2
step_max_m = 0.4
platform_step_m = 1.1
cover_low_m = 1.8
cover_high_m = 2.8
wall_min_m = 1.5
gap_max_m = 4
show = true
cell_count = 60
# Débord de la dalle de plafond au-delà de l'emprise de la salle.
# Le creusement ouvre la salle AVEC une marge : une dalle taillée pile sur
# l'emprise laisserait une fente ouverte sur ~200 m de développé par salle.
ceiling_overhang_m = 1.5

# Code couleur fonctionnel : le joueur lit la fonction, pas la déco.
[palette]
floor = [0.46, 0.46, 0.49]
platform = [0.55, 0.5, 0.41]
cover = [0.38, 0.41, 0.45]
wall = [0.27, 0.29, 0.33]
traversal = [0.9, 0.63, 0.18]
perch = [0.34, 0.6, 0.76]
ceiling = [0.24, 0.24, 0.27]

[arena]
name = "Les Cryptes verticales"
shape = "rectangular"
size_x = 220
size_z = 144
extent_m = 30
wall_height_m = 12
wall_thickness_m = 1
spawn_pos = [-100, 1.5, 0]
spawn_yaw_deg = -90

# ── LES SALLES ──────────────────────────────────────────────────
# `center[1]` = niveau du SOL. `ceiling_m` = hauteur libre (0 = ciel ouvert).
# Toute salle couverte doit avoir au moins 3,18 m sous plafond (joueur 2,0 +
# saut 1,174), sinon on se cogne dès qu'on appuie sur espace.

[[rooms]]
id = "entree"
role = "spawn"
center = [-92, 0, 0]
size = [36, 12, 64]
ceiling_m = 6

[[rooms]]
id = "terrasse"
role = "combat"
center = [-35, 4, 32]
size = [55, 4, 22]
ceiling_m = 0

[[rooms]]
id = "tunnel"
role = "flank"
center = [-40, 0, 0]
size = [66, 6, 14]
ceiling_m = 4

[[rooms]]
id = "ruines"
role = "reward"
center = [-32, 0, -35]
size = [64, 10, 46]
ceiling_m = 0

[[rooms]]
id = "cour"
role = "combat"
center = [15, 2, 0]
size = [30, 2, 52]
ceiling_m = 0

[[rooms]]
id = "pont"
role = "bridge"
center = [45, 3, 0]
size = [22, 1, 14]
ceiling_m = 0

[[rooms]]
id = "chapelle"
role = "boss"
center = [80, 4, 0]
size = [45, 4, 54]
ceiling_m = 7

