# Roguelite — Audio (story-559 slice A, 2026-06-04)
#
# SFX combat (impact/kill/hurt) + ding pickup (Or/Âmes) + musique (combat/break).
# Hot-reload Shift+F12 (poll mtime 1Hz). Volumes 0..2 (1.0 = nominal).
# Chemins relatifs à la racine `assets/`. Pack original reproductible via
# `tools/audio/generate_forgia_da.py`, sans sample tiers. Swap = modifier le
# chemin puis Shift+F12.

master_volume = 0.9
music_volume = 0.45
ui_sfx_volume = 1.0     # trim global famille UI (story-678) — scalaire AVANT les tables

[impact]                # hit ennemi (court, fréquent) — Kenney impactGeneric_light
path = "audio/forgia_original/combat/impact_forge.ogg"
volume = 0.45

[weakspot]              # « tink » tête/weakspot (story-651) — Kenney impactMetal_light
                        # Pitch FIXE (signature pavlovienne), couche additive à CHAQUE
                        # headshot (même au kill — double récompense Gunfire Reborn).
path = "audio/forgia_original/combat/weakspot_chime.ogg"
volume = 0.8

[kill]                  # kill (meaty) — Kenney impactMining
path = "audio/forgia_original/combat/kill_stamp.ogg"
volume = 0.7

[hurt]                  # joueur touché (thud sourd) — Kenney impactPlank
path = "audio/forgia_original/combat/player_hurt.ogg"
volume = 0.6

[ding_gold]             # ramassage Or — Kenney handleCoins
path = "audio/forgia_original/pickups/gold_spark.ogg"
volume = 0.6

[ding_souls]            # ramassage Âme (cloche éthérée) — Kenney impactBell
path = "audio/forgia_original/pickups/soul_echo.ogg"
volume = 0.55

# Musique CONTINUE du jeu = le morceau « entre les waves » (user 2026-06-05).
# combat == break → pas de switch/restart aux transitions de wave.
# 2026-08-05 : music_combat/break ne servent plus que de FALLBACK (chapitre sans
# piste dédiée). La bande-son réelle = music_hub + music_chapters ci-dessous.
[music_combat]
path = "audio/forgia_original/music/forged_destiny_loop.ogg"
volume = 0.8

[music_break]
path = "audio/forgia_original/music/forged_destiny_loop.ogg"
volume = 0.8

