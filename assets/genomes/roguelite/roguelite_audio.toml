# ── Sons de TIR par arme (slice B) ──────────────────────────────────────────
# Mapping slot Digit1-4 : Pépin=sec/mécanique · Bourrasque=air/rafale ·
# Lenoir=noble/cristalline · Boucherie=fournaise/lourde.
#
# RE-BALANCE 2026-08-05 (« on n'entend pas bien les armes »). Cause MESURÉE :
# la bande-son Suno arrive à -17,8 dB de moyenne quand les tirs sont à ~-35 dB
# — 17 dB d'écart, la musique masquait les armes. Les volumes montent d'environ
# +5 à +7 dB, bornés pour que la crête reste sous -2 dB APRÈS master_volume :
#   crête finale = crête_fichier + 20·log10(volume) + 20·log10(master 0.9)
# Crêtes fichier mesurées (ffmpeg volumedetect) : pépin -7,5 · bourrasque -10,0
# · lenoir -9,9 · boucherie -5,9 dB. La hiérarchie anti-fatigue de CREDITS.md
# est conservée : les armes FRÉQUENTES restent en retrait des armes RARES.

[fire_pepin]        # Digit1 — pistolet (CZ-52) · fréquent → crête finale ≈ -2,2 dB
path = "audio/forgia_original/weapons/pepin_forge.ogg"
volume = 2.05

[fire_bourrasque]   # Digit2 — mitraillette (SKS) · full-auto, le plus répété →
                    # gardé sous les autres (les instances se cumulent) ≈ -4,0 dB
path = "audio/forgia_original/weapons/bourrasque_gale.ogg"
volume = 2.20

[fire_lenoir]       # Digit3 — sniper (Mosin Nagant) · rare, doit CLAQUER ≈ -1,8 dB
path = "audio/forgia_original/weapons/lenoir_royal.ogg"
volume = 2.80

[fire_boucherie]    # Digit4 — pompe · rare mais fichier déjà chaud (-5,9) ≈ -2,0 dB
path = "audio/forgia_original/weapons/boucherie_furnace.ogg"
volume = 1.75

# ── Boucle de jeu ───────────────────────────────────────────────────────────
# Tous les assets ci-dessous sont versionnés et originaux Forgia.
#
# RE-BALANCE 2026-08-05 (demande user) : les sons d'ANIMATION (dash, recharge,
# changement d'arme, pas) reculent d'environ -6 dB. Ils accompagnent le geste,
# ils ne doivent pas concurrencer le tir — surtout maintenant que les armes
# ont pris +6 dB. Ce sont les sons les plus RÉPÉTÉS de la boucle : c'est là que
# la fatigue d'écoute se paie en premier.

[dash]
path = "audio/forgia_original/movement/dash_ember.ogg"
volume = 0.28

# Le rechargement REMONTE (2026-08-05, 2e passe) : ce n'est pas de l'ambiance,
# c'est de l'INFORMATION — « je peux retirer » doit s'entendre en plein combat.
# `reload_complete` passe devant `reload_start` : c'est la fin qui rend la main.
# Crêtes fichier : start -8,1 dB · complete -8,0 dB → finales ≈ -12 / -10 dB,
# soit ~8-10 dB sous les tirs : audible, jamais concurrent.

[reload_start]
path = "audio/forgia_original/movement/reload_start.ogg"
volume = 0.70

[reload_complete]
path = "audio/forgia_original/movement/reload_complete.ogg"
volume = 0.90

[weapon_switch]
path = "audio/forgia_original/movement/weapon_switch.ogg"
volume = 0.20

[boon]
path = "audio/forgia_original/events/boon_forged.ogg"
volume = 0.70

[chest]
path = "audio/forgia_original/events/chest_open.ogg"
volume = 0.65

[wave_clear]
path = "audio/forgia_original/events/wave_clear.ogg"
volume = 0.60

[wave_start]
path = "audio/forgia_original/events/wave_start.ogg"
volume = 0.55

[boss_enrage]
path = "audio/forgia_original/events/boss_enrage.ogg"
volume = 0.85

[victory]
path = "audio/forgia_original/events/victory.ogg"
volume = 0.90

[defeat]
path = "audio/forgia_original/events/defeat.ogg"
volume = 0.75

[ambience]
path = "audio/forgia_original/ambience/forge_heart_loop.ogg"
volume = 0.28

