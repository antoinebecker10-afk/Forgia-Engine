# roguelite_ambiances.toml — les UNIVERS d'arène (story-676).
#
# Une ambiance = **sol + ciel + brouillard + ambiante**, déclarés ENSEMBLE. C'est
# la bonne unité : avant, le ciel était indexé sur `biome` (un champ hérité du
# terrain ouvert, sans objet pour une arène), le sol était une constante Rust
# identique aux 4 arènes, et le brouillard était volcanique partout — Hauts
# Pâturages compris.
#
# Hot-reload : poll mtime 1 Hz, comme les autres génomes roguelite.
# Miroir exact des `Default` Rust (`ambiances.rs`) : si ce fichier disparaît ou
# devient invalide, on retombe sur ces défauts, et un `warn!` le dit.
#
# ─────────────────────────────────────────────────────────────────────────────
# LES SOLS
# ─────────────────────────────────────────────────────────────────────────────
# Exactement 3 tuiles par palette : le mélangeur du sol (`plan_floor_tiles`)
# produit un `kind` 0/1/2. tiles[0] = dominante, [1] et [2] = variantes semées.
#
# `tile_size_m` DOIT être le côté réel mesuré de la tuile — l'arène pave à ce
# pas. Les 12 tuiles ci-dessous sont mesurées à 4,0 × 4,0 m, X ∈ [−2, +2], et
# **minY = −0,100 pour toutes les douze** : elles sont interchangeables sans
# décalage vertical. Vérifié fichier par fichier, pas supposé.
#
# ⚠️ Changer `tile_size_m` change le NOMBRE de tuiles au carré : une arène pave
# ~1 600 cellules à 4 m, donc ~6 400 à 2 m. Le coût de fusion n'est pas mesuré
# en-dessous de 4 m — ne pas descendre sans mesurer.

[floors.forge_pierre]
tile_size_m = 4.0
tiles = [
    "models/kaykit/dungeon/floor.glb",
    "models/kaykit/dungeon/floor_dirt.glb",
    "models/kaykit/dungeon/floor_rocks.glb",
]

[floors.crypte_dalles]
tile_size_m = 4.0
tiles = [
    "models/kaykit/dungeon_remastered/floor_tile_large.gltf.glb",
    "models/kaykit/dungeon_remastered/floor_tile_large_rocks.gltf.glb",
    "models/kaykit/dungeon_remastered/floor_dirt_large_rocky.gltf.glb",
]

[floors.halles_bois]
tile_size_m = 4.0
tiles = [
    "models/kaykit/dungeon_remastered/floor_wood_large.gltf.glb",
    "models/kaykit/dungeon_remastered/floor_wood_large_dark.gltf.glb",
    "models/kaykit/dungeon_remastered/floor_tile_large.gltf.glb",
]

[floors.terre_battue]
tile_size_m = 4.0
tiles = [
    "models/kaykit/dungeon_remastered/floor_dirt_large.gltf.glb",
    "models/kaykit/dungeon_remastered/floor_dirt_large_rocky.gltf.glb",
    "models/kaykit/dungeon_remastered/floor_tile_large_rocks.gltf.glb",
]

# ─────────────────────────────────────────────────────────────────────────────
# LES AMBIANCES
# ─────────────────────────────────────────────────────────────────────────────
# `sky` référence une clé de `assets/genomes/biome_sky.toml` (12 palettes y sont
# déclarées ; avant cette story, 2 étaient utilisées).
#
# fog_rgb / ambient_rgb : linéaire 0-1 (srgb), comme les consts qu'ils remplacent.
# fog_density : densité exponentielle, ~1/d = distance de demi-brume.
#   ⚠️ 0.008 → ~125 m, alors que la plus longue ligne de vue mesurée dans nos
#   arènes est 24,2 m. Le brouillard ne fait donc RIEN au gameplay : il ne sert
#   que la teinte. C'est assumé, pas ignoré.
# ambient_brightness : lux de l'ambiante (300 = valeur historique forge).

[ambiances.forge_ardente]
label = "Forge ardente"
floor = "forge_pierre"
sky = "volcanic"
fog_rgb = [0.30, 0.10, 0.07]
fog_sun_rgb = [1.00, 0.55, 0.25]
fog_density = 0.008
ambient_rgb = [1.00, 0.45, 0.22]
ambient_brightness = 300.0

[ambiances.crypte_suintante]
label = "Crypte suintante"
floor = "crypte_dalles"
sky = "swamp"
fog_rgb = [0.10, 0.15, 0.12]
fog_sun_rgb = [0.60, 0.80, 0.55]
fog_density = 0.011
ambient_rgb = [0.45, 0.70, 0.55]
ambient_brightness = 220.0

[ambiances.halles_de_bois]
label = "Halles de bois"
floor = "halles_bois"
sky = "plains"
fog_rgb = [0.28, 0.22, 0.15]
fog_sun_rgb = [1.00, 0.85, 0.60]
fog_density = 0.006
ambient_rgb = [1.00, 0.82, 0.58]
ambient_brightness = 340.0

[ambiances.necropole_glacee]
label = "Nécropole glacée"
floor = "crypte_dalles"
sky = "tundra"
fog_rgb = [0.16, 0.20, 0.28]
fog_sun_rgb = [0.70, 0.82, 1.00]
fog_density = 0.010
ambient_rgb = [0.62, 0.74, 1.00]
ambient_brightness = 260.0

[ambiances.gorges_d_ocre]
label = "Gorges d'ocre"
floor = "terre_battue"
sky = "canyon"
fog_rgb = [0.32, 0.18, 0.10]
fog_sun_rgb = [1.00, 0.72, 0.40]
fog_density = 0.007
ambient_rgb = [1.00, 0.68, 0.40]
ambient_brightness = 320.0

[ambiances.cime_de_pierre]
label = "Cime de pierre"
floor = "terre_battue"
sky = "mountain"
fog_rgb = [0.20, 0.22, 0.28]
fog_sun_rgb = [0.85, 0.90, 1.00]
fog_density = 0.009
ambient_rgb = [0.72, 0.80, 0.95]
ambient_brightness = 280.0

# ─────────────────────────────────────────────────────────────────────────────
# LA ROTATION — le ciel comme HORLOGE DE RUN
# ─────────────────────────────────────────────────────────────────────────────
# L'ambiance suit la PROFONDEUR du round, pas l'identité de la salle. Le joueur
# voit où il en est dans sa run sans regarder l'interface (Hades le fait par
# région, Risk of Rain 2 par étage).
#
# `order` est parcouru dans l'ordre, puis **bouclé** : round 6 revient à
# `order[0]`. La boucle est voulue — les rounds sont infinis, la liste ne l'est
# pas. Ce qui distingue le 2ᵉ tour du 1ᵉʳ, c'est la difficulté, pas le décor.

[rotation]
order = [
    "forge_ardente",
    "crypte_suintante",
    "halles_de_bois",
    "gorges_d_ocre",
    "necropole_glacee",
    "cime_de_pierre",
]
# Si true, la graine de run décale le point de départ de la rotation : deux runs
# ne commencent pas dans le même univers. Le ROND reste ordonné (l'horloge tient).
shuffle_start_by_seed = true
