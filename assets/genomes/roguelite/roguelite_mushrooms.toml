# Champignons lumineux des Cryptes de l'Enclume (story-625).
# Bible crypts_of_anvil.md : "petits champignons lumineux bleus, jaunes, roses
# (touche mignonne contre la noirceur)". Cult of the Lamb : sinistre digestible.
#
# Hot-reload (mtime 1Hz) : tune positions/couleurs/intensité live, re-pose les
# clusters sans rebuild. `enabled = false` → coupe la feature (garde-fou).
# Consommé par forgia-mode-roguelite/src/mushrooms.rs. Capteur forgia2_mushrooms.json.
#
# Couleurs en srgb [r, g, b] (0..1). Posés près des covers/coins (la bible : on les
# voit en se planquant). 1 PointLight par cluster + N meshes émissifs (glow bloom).

enabled = true
mushroom_size = 0.4       # échelle d'un champignon (chapeau + pied)
light_intensity = 1800.0  # lumens par cluster (cap 8000) — lueur douce, pas brasero
light_range = 8.0         # portée de la lueur (m)
emissive_boost = 5.0      # multiplicateur émissif du chapeau (glow + bloom)

# ── Cover bas de la fosse à mêlée (rose + bleu) ───────────────────────────────
[[clusters]]
pos = [16.0, 0.0, -9.0]   # contre Mound_005 (cover bas droit)
color = [1.0, 0.45, 0.7]  # rose — "le secret" accueillant
count = 6
radius = 2.6

[[clusters]]
pos = [-16.0, 0.0, -9.0]  # contre Mound_008 (cover bas gauche)
color = [0.35, 0.6, 1.0]  # bleu champignon
count = 6
radius = 2.6

