# roguelite_progression.toml — Progression de l'arme EN COURS DE RUN (story-653).
#
# Data-driven + hot-reload (poll mtime 1Hz) : édite pendant que le jeu tourne pour
# régler l'économie de la Trempe SANS rebuild. Miroir exact des `Default` Rust
# (trempe.rs) — si ce fichier disparaît/est invalide, retombe sur ces défauts.
#
# « La Trempe » : chez le Forgeron Itinérant (marchand), le joueur dépense de l'Or
# pour tremper son arme → +dégâts par palier (multiplicatif avec les boons/méta).

[trempe]
# Active la mécanique. false = la Trempe disparaît (retour au comportement pré-653).
enabled = true
# Bonus de dégâts PAR palier (fraction). 0.15 = +15 %/palier, multiplicatif.
damage_per_level = 0.15
# Nombre max de trempes par run.
level_cap = 5
# Coût du 1er palier (Or). Les kills donnent ~2-5 Or → 1re trempe en ~4-10 kills.
cost_base = 20
# Facteur de croissance du coût par palier. 1.4 → 20 / 28 / 39 / 55 / 77.
cost_growth = 1.4

# ── Scaling ennemi par profondeur (story-658) ────────────────────────────────
# La PRESSION qui donne son sens à la Trempe : plus on avance dans les salles
# (`stage`), plus les ennemis sont durs. Salle 0 = ×1.0 (référence). Sans ce
# scaling, monter son arme rendait le jeu trivial.
[scaling]
enabled = true
# +HP (vie + bouclier + armure) par salle. 0.35 = +35 %/salle (salle 2 = ×1.70).
hp_per_stage = 0.35
# +dégâts des tirs ennemis par salle. 0.15 = +15 %/salle.
damage_per_stage = 0.15
