# ═══════════════════════════════════════════════════════════════════════════
# Quel stage porte quelle DA.
# C'est ICI qu'on ré-habille une salle sans toucher au code : change la valeur,
# sauvegarde, le décor se reconstruit à la prochaine salle.
# Un stage absent de cette table retombe sur `inferno` (avec un warn).
# ═══════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════
# 5 → 10. LES SIX DA DU LIVRE (2026-08-04)
#
# Décision : 10 chapitres, 10 directions artistiques DISTINCTES — pas dix
# recombinaisons d'un même jeu de props. C'était possible parce que les packs se
# SUBDIVISENT : `kenney/nature` n'est pas « une famille nature », c'en est dix
# (tree 61 · cliff 56 · stone 30 · rock 30 · crops 21 · bridge 16 · fence 12 ·
# flower 9 · plant 8 · stump 7 · mushroom 6 · tent 4 · campfire 4), et
# `dungeon_remastered` pareil (table 14 · trunk 9 · bottle 8 · candle 6 …).
#
# ⚠️ Chaque chemin ci-dessous a été LU sur le disque, pas déduit d'un motif de
# nommage. C'est la seule protection qui vaille : un chemin absent ne casse rien,
# il vide la salle en silence.
#
# ⚠️ Les murs viennent tous de `kaykit/dungeon` (module MESURÉ à 4,00 m).
# `medieval_hexagon/wall_straight` ne fait que 1,10 m — le joueur saute 1,174 m,
# donc il passe PAR-DESSUS. C'est une clôture, pas un mur (cf `roguelite_rooms.toml`).
# ═══════════════════════════════════════════════════════════════════════════

# ── 5. LA SALLE DE FESTIN — intérieur habité, tables et chandelles ───────────
