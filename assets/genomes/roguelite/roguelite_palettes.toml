# ═══════════════════════════════════════════════════════════════════════════
# 2. LE DONJON OUBLIÉ — intérieur bâti, clos et lisible
#    Pack KayKit Dungeon pur. Contraste avec la Crypte : ce n'est pas un
#    extérieur volcanique, c'est une SALLE. Tonneaux, caisses, coffres,
#    bannières colorées, colonnes régulières. Le sol est dallé, pas rocheux.
#    Lecture de combat : repères réguliers, silhouettes basses et denses.
# ═══════════════════════════════════════════════════════════════════════════
[palettes.donjon]
name = "Le Donjon Oublié"
landmarks = [
    "models/kaykit/dungeon/column.glb",
]
big = [
    "models/kaykit/dungeon/column.glb",
    "models/kaykit/dungeon/barrels_stack.glb",
    "models/kaykit/dungeon/crates.glb",
    "models/kaykit/dungeon/chest_gold.glb",
    "models/kaykit/dungeon/wall_broken.glb",
]
# Story-684 — les bannières ont QUITTÉ ce pool. Elles y étaient plantées debout
# en plein champ ET calibrées à la taille d'un brasero, alors qu'une tenture de
# 1,50 × 0,31 m pour 3,20 m de haut n'a de sens que contre une paroi (cf le Hall,
# où elles sont toujours collées à un mur). Elles vivent désormais dans
# `wall_props`, posé sur les tronçons de mur des pièces.
braziers = [
    "models/kaykit/dungeon/torch.glb",
]
wall_props = [
    "models/kaykit/dungeon/banner_red.glb",
    "models/kaykit/dungeon/banner_blue.glb",
    "models/kaykit/dungeon/banner_yellow.glb",
    "models/kaykit/dungeon/torch_wall.glb",
]
scatter = [
    "models/kaykit/dungeon/barrel.glb",
    "models/kaykit/dungeon/crates.glb",
    "models/kaykit/dungeon/chest.glb",
    "models/kaykit/dungeon/chest_basic.glb",
    "models/kaykit/dungeon/rubble.glb",
    "models/kaykit/dungeon/floor_rocks.glb",
]
walls = [
    "models/kaykit/dungeon/wall.glb",
    "models/kaykit/dungeon/wall_window.glb",
    "models/kaykit/dungeon/wall.glb",
    "models/kaykit/dungeon/wall_broken.glb",
]
wall_corner = "models/kaykit/dungeon/wall_corner.glb"
rubble = ["models/kaykit/dungeon/rubble.glb"]
buildings = []

# ═══════════════════════════════════════════════════════════════════════════
# 3. LES HAUTS PÂTURAGES — extérieur clair, low-poly coloré
#    Pack KayKit Hexagon (nature). CONTRASTE MAXIMAL avec la Crypte : lumineux,
#    dégagé, collines et arbres. Longues lignes de vue → c'est la salle où
#    Madame Lenoir (sniper, portée 300 m, aucun falloff) prend enfin son sens.
#    Les « braseros » deviennent des arbres : la catégorie porte une lumière,
#    ici on l'éteint en n'y mettant que du végétal (le ratio brasero du génome
#    de décor reste réglable si tu veux des feux de camp).
# ═══════════════════════════════════════════════════════════════════════════
[palettes.paturages]
