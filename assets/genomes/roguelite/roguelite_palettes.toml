# ═══════════════════════════════════════════════════════════════════════════
# LA TABLE DU LIVRE — un chapitre, une direction artistique
#
# C'est ICI que se décide ce que le joueur traverse, chapitre par chapitre. Elle
# a la PRIORITÉ sur `[stage_palette]` : dans un chapitre, la DA tient du round 1
# au round 10, et ce sont la géométrie et le semis de props qui changent d'une
# arène à l'autre. Le changement de DA marque le passage au chapitre SUIVANT —
# il ne vaut que parce qu'il est rare.
#
# L'ordre monte du souterrain vers le grand air, puis se referme : on commence
# dans la forge, on finit dans les champs. Change une valeur, sauvegarde, le
# chapitre se ré-habille à la prochaine arène.
#
# ⚠️ Un id de palette inconnu est IGNORÉ (repli sur la table par stage) plutôt
# que de produire une salle vide — une faute de frappe ne doit pas se découvrir
# en jeu.
# ═══════════════════════════════════════════════════════════════════════════
[chapter_palette]
1 = "inferno"      # La Crypte de l'Enclume — le départ, l'identité forge
2 = "donjon"       # Le Donjon Oublié
3 = "festin"       # La Salle de Festin
4 = "tresor"       # La Réserve
5 = "bourg"        # Le Bourg — on sort enfin
6 = "foret"        # La Forêt Profonde
7 = "falaises"     # Les Falaises
8 = "rocaille"     # La Rocaille
9 = "paturages"    # Les Hauts Pâturages
10 = "champs"      # Les Champs — le dernier, le plus exposé

# ═══════════════════════════════════════════════════════════════════════════
[stage_palette]
crypts_of_anvil = "inferno"
forge_sanctum = "bourg"
donjon_oublie = "donjon"
hauts_paturages = "paturages"
