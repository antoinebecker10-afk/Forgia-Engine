    "models/kaykit/hexagon/decoration/nature/trees_B_large.gltf",
    "models/kaykit/hexagon/decoration/nature/trees_A_medium.gltf",
]
scatter = [
    "models/kaykit/hexagon/decoration/nature/hill_single_A.gltf",
    "models/kaykit/hexagon/decoration/nature/hill_single_B.gltf",
    "models/kaykit/hexagon/decoration/nature/hill_single_C.gltf",
