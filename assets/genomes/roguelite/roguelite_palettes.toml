# roguelite_palettes.toml — LES DIRECTIONS ARTISTIQUES (story-671).
#
# ── Pourquoi ce fichier existe ───────────────────────────────────────────────
# Les catalogues de props vivaient en `const &[&str]` dans decor.rs : UNE seule
# palette (pack Inferno + murs KayKit dungeon), donc toutes les salles de toutes
# les runs avaient exactement le même habillage. Le décor bougeait — les props
# sont semés à la graine — mais c'étaient toujours les mêmes objets.
#
# Une DA = un jeu de props cohérent + le kit de remparts qui va avec. Le stage
# déclare sa palette (`[stage_palette]` en bas), et le décor la lit.
#
# ⚠️ Tous les chemins ci-dessous existent dans `assets/models/` — vérifiés fichier
# par fichier. Un chemin absent ne casse rien (Bevy log une erreur d'asset et le
# prop est simplement absent), mais ça fait une salle plus vide que prévu.
#
# Hot-reload : sauvegarder ce fichier recharge les catalogues (poll mtime 1 Hz).
# Miroir exact des `Default` Rust (decor_palettes.rs).

# ═══════════════════════════════════════════════════════════════════════════
# 1. LA CRYPTE DE L'ENCLUME — volcanique, la DA de référence
#    Pack Inferno. Sombre, braises, colonnes brisées, engrenages. C'est
#    l'identité forge/enfer du jeu : celle qu'on garde comme point de comparaison.
# ═══════════════════════════════════════════════════════════════════════════
[palettes.inferno]
