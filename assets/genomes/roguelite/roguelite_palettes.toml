# ═══════════════════════════════════════════════════════════════════════════
# 4. LE BOURG — village civil, verticalité de toits
#    Pack KayKit Hexagon rouge, versant CIVIL (église, moulins, taverne,
#    maisons, puits, marché) — l'industriel en ruine (forge, mine, catapulte,
#    échafaudages) reste à la Crypte. Des bâtiments à CONTOURNER : couloirs
#    entre les maisons, toits qui cassent les lignes de vue. C'est la salle la
#    plus « couloirs », l'inverse exact des Pâturages.
# ═══════════════════════════════════════════════════════════════════════════
