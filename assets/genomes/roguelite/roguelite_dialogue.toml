id = "roguelite_dialogue"
name = "Roguelite Talking Weapons Dialogue"
domain = "Audio"
category = "Audio"
description = "Système barks contextuels pour les 4 armes parlantes MVP. Pattern Hadès (Kasavin GDC 2021) : event triggers + LinePool weighted + BarkSelector cooldown + priority override. Mantra : 'What would these characters notice?'"
version = "0.1.0"

# === Global bark tuning ===

[[genes]]
id = "bark_global_speaker_lock_sec"
label = "Time another weapon must wait after one barks (anti-overlap)"
chromosome = "Cooldown"
target = "Value"
min = 0.0
max = 10.0
default = 2.5
layer = "roguelite_dialogue"

[[genes]]
id = "bark_global_max_per_minute"
label = "Max barks per minute (anti-fatigue)"
chromosome = "Cooldown"
target = "Value"
min = 1.0
max = 60.0
default = 12.0
layer = "roguelite_dialogue"

[[genes]]
id = "bark_priority_death_override"
label = "Priority threshold above which cooldown is ignored"
chromosome = "Priority"
target = "Value"
min = 50.0
max = 255.0
default = 150.0
layer = "roguelite_dialogue"

# === Event trigger probabilities (chance to fire a bark on event) ===

[[genes]]
id = "bark_chance_on_kill"
label = "P(bark) on enemy kill"
chromosome = "Trigger"
target = "Value"
min = 0.0
max = 1.0
default = 0.30
layer = "roguelite_dialogue"

[[genes]]
id = "bark_chance_on_lowhp"
label = "P(bark) when player HP crosses lowhp threshold"
chromosome = "Trigger"
target = "Value"
min = 0.0
max = 1.0
default = 0.70
layer = "roguelite_dialogue"

[[genes]]
id = "bark_lowhp_threshold_pct"
label = "Low HP threshold for bark trigger"
chromosome = "Trigger"
target = "Value"
min = 0.05
max = 0.60
default = 0.25
layer = "roguelite_dialogue"

[[genes]]
id = "bark_chance_on_reload"
label = "P(bark) on reload (limit to empty mag only)"
chromosome = "Trigger"
target = "Value"
min = 0.0
max = 1.0
default = 0.15
layer = "roguelite_dialogue"

[[genes]]
id = "bark_idle_after_sec"
label = "Idle bark fires after this many sec without combat"
chromosome = "Trigger"
target = "Value"
min = 10.0
max = 120.0
# 2026-05-20 — relevé 30 → 45 (RoR2 ~45, LoL ~50). Idle à 30s donne sensation
# "blabla constant" en gameplay calme. Source : audit standards AAA + leçon
# Borderlands 3 anti-fatigue (>30/min muté par les joueurs).
default = 45.0
layer = "roguelite_dialogue"

[[genes]]
id = "bark_chance_on_pickup"
label = "P(bark) on item pickup"
chromosome = "Trigger"
target = "Value"
min = 0.0
max = 1.0
# 2026-05-20 — relevé 0.25 → 0.35 (RoR2 item callout >0.40, OW pickup chatter
# ~0.40). Pickup = event excitant, peut tolérer plus de chance sans fatigue.
default = 0.35
layer = "roguelite_dialogue"

# ╔══════════════════════════════════════════════════════════════╗
# ║ LINE POOLS — pattern Hadès                                   ║
# ║ Format: speaker.event = [{ text, weight, priority, cooldown_sec }]
# ║ priority 0-255 ; >bark_priority_death_override = override CD ║
# ╚══════════════════════════════════════════════════════════════╝

# --- PÉPIN (timide, hésitant, voix douce) ---

[[pool]]
speaker = "pepin"
event = "kill"
lines = [
  { id = "pepin_kill_01", text = "Oh... pardon...", weight = 30, priority = 30, cooldown_sec = 12.0 },
  { id = "pepin_kill_02", text = "Je crois que je l'ai eu ?", weight = 25, priority = 30, cooldown_sec = 12.0 },
  { id = "pepin_kill_03", text = "Ce n'était pas mon intention...", weight = 20, priority = 30, cooldown_sec = 15.0 },
  { id = "pepin_kill_04", text = "Désolé !", weight = 25, priority = 30, cooldown_sec = 10.0 },
]

[[pool]]
speaker = "pepin"
event = "lowhp"
lines = [
  { id = "pepin_lowhp_01", text = "Aïe... ça pique...", weight = 50, priority = 80, cooldown_sec = 20.0 },
  { id = "pepin_lowhp_02", text = "Tu... tu fais attention ?", weight = 50, priority = 80, cooldown_sec = 20.0 },
]

[[pool]]
speaker = "pepin"
event = "idle"
lines = [
  { id = "pepin_idle_01", text = "Tu... tu veux que je dorme ?", weight = 40, priority = 10, cooldown_sec = 60.0 },
  { id = "pepin_idle_02", text = "On bouge ?", weight = 60, priority = 10, cooldown_sec = 45.0 },
]

[[pool]]
