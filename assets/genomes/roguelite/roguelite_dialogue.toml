id = "roguelite_dialogue"
name = "Roguelite Talking Weapons Dialogue"
domain = "Audio"
category = "Audio"
description = "Système barks contextuels pour les 4 armes parlantes MVP. Pattern Hadès (Kasavin GDC 2021) : event triggers + LinePool weighted + BarkSelector cooldown + priority override. Mantra : 'What would these characters notice?'"
version = "0.1.0"

# === Global bark tuning ===

[[genes]]
id = "bark_global_speaker_lock_sec"
label = "Time another weapon must wait after one barks (anti-overlap)"
chromosome = "Cooldown"
target = "Value"
min = 0.0
max = 10.0
default = 2.5
layer = "roguelite_dialogue"

[[genes]]
id = "bark_global_max_per_minute"
label = "Max barks per minute (anti-fatigue)"
chromosome = "Cooldown"
target = "Value"
min = 1.0
max = 60.0
default = 12.0
layer = "roguelite_dialogue"

[[genes]]
id = "bark_priority_death_override"
label = "Priority threshold above which cooldown is ignored"
chromosome = "Priority"
target = "Value"
min = 50.0
max = 255.0
default = 150.0
layer = "roguelite_dialogue"

# === Event trigger probabilities (chance to fire a bark on event) ===

[[genes]]
id = "bark_chance_on_kill"
label = "P(bark) on enemy kill"
chromosome = "Trigger"
target = "Value"
min = 0.0
max = 1.0
default = 0.30
layer = "roguelite_dialogue"

[[genes]]
id = "bark_chance_on_miss"
label = "P(bark) on missed shot (only speakers with a miss pool judge)"
chromosome = "Trigger"
target = "Value"
min = 0.0
max = 1.0
default = 0.35
layer = "roguelite_dialogue"

[[genes]]
id = "bark_chance_on_lowhp"
label = "P(bark) when player HP crosses lowhp threshold"
chromosome = "Trigger"
target = "Value"
min = 0.0
max = 1.0
default = 0.70
layer = "roguelite_dialogue"

[[genes]]
id = "bark_lowhp_threshold_pct"
label = "Low HP threshold for bark trigger"
chromosome = "Trigger"
target = "Value"
min = 0.05
max = 0.60
default = 0.25
layer = "roguelite_dialogue"

[[genes]]
id = "bark_chance_on_reload"
label = "P(bark) on reload (limit to empty mag only)"
chromosome = "Trigger"
target = "Value"
min = 0.0
max = 1.0
default = 0.15
layer = "roguelite_dialogue"

[[genes]]
id = "bark_idle_after_sec"
label = "Idle bark fires after this many sec without combat"
chromosome = "Trigger"
target = "Value"
min = 10.0
max = 120.0
# 2026-05-20 — relevé 30 → 45 (RoR2 ~45, LoL ~50). Idle à 30s donne sensation
# "blabla constant" en gameplay calme. Source : audit standards AAA + leçon
# Borderlands 3 anti-fatigue (>30/min muté par les joueurs).
default = 45.0
layer = "roguelite_dialogue"

[[genes]]
id = "bark_chance_on_pickup"
label = "P(bark) on item pickup"
chromosome = "Trigger"
target = "Value"
min = 0.0
max = 1.0
# 2026-05-20 — relevé 0.25 → 0.35 (RoR2 item callout >0.40, OW pickup chatter
# ~0.40). Pickup = event excitant, peut tolérer plus de chance sans fatigue.
default = 0.35
layer = "roguelite_dialogue"

