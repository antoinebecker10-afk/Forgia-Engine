# roguelite_cosmetics.toml — LE MARKETPLACE : tout ce qui se porte et ne se
# joue pas.
#
# Story-678, 2026-08-06. Né comme catalogue de décors, généralisé le même jour :
# quatre familles, un seul catalogue, une seule règle de possession.
#
#   kind = "decor"  → le fond du menu          (palette + ambiance)
#   kind = "color"  → la couleur du forgeron   (color = id de roguelite_identity.toml)
#   kind = "arm"    → les bras vus en FPS      (arm_style + color)
#   kind = "music"  → le morceau du hub        (music = clé de piste)
#
# ─── Comment on l'obtient (`source`) ────────────────────────────────────────
#
#   "start"    possédé dès la première partie
#   "chapter"  gagné en battant le chapitre `chapter` — DÉRIVÉ de la
#              progression, jamais stocké (sinon divergence à la première
#              renumérotation des chapitres)
#   "shards"   acheté `price` ÉCLATS — stocké
#   "exploit"  accordé par un haut fait — stocké
#
# ⚠ Les hauts faits N'EXISTENT PAS encore. La source "exploit" est implémentée
# et testée, mais aucune entrée ne l'utilise : un article inobtenable serait du
# contenu mort.
#
# ─── Les ÉCLATS, monnaie cosmétique ─────────────────────────────────────────
#
# Séparés des Âmes par décision du 2026-08-06. Un cosmétique payé en Âmes est un
# rang d'Enclume non acheté, et la courbe de puissance est en cours de
# recalibrage : deux monnaies = deux lectures qui ne se brouillent pas.
#
# ⚠ PREMIER JET, jamais joué. Une run de 10 rounds gagnée rapporte
# 10×1 + 10 = 20 Éclats ; une couleur en coûte 40 (deux runs), un décor de
# variante 90 (~4-5 runs). À confronter au playtest.

[shards]
per_round = 1            # récompense la PROFONDEUR atteinte, pas le temps passé
per_chapter_cleared = 10 # prime de chapitre bouclé

