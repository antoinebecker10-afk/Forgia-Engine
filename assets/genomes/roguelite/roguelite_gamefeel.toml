# roguelite_gamefeel.toml — knockback (story-650).
# Chaque balle pousse l'ennemi ; aucun ralentissement global n'est appliqué au tir.
# Déplacements en MÈTRES totaux. Capteur : forgia2_knockback.json.

[[genes]]
id = "knockback_base_m"
default = 0.3   # poussée par hit, avant multiplicateur d'arme

[[genes]]
id = "knockback_kill_mult"
default = 3.0   # le corps part en arrière au kill

[[genes]]
id = "knockback_pop_up_m"
default = 0.25  # composante verticale au kill — le « pop »

[[genes]]
id = "knockback_max_m"
default = 2.5   # déplacement cumulé max (anti-éjection hors arène en full-auto)

[[genes]]
id = "knockback_mult_pepin"
default = 0.6   # Pépin picote

[[genes]]
id = "knockback_mult_bourrasque"
default = 0.45  # SMG : micro-poussées rapides

[[genes]]
id = "knockback_mult_lenoir"
default = 1.6   # sniper : un seul coup qui déplace

[[genes]]
id = "knockback_mult_boucherie"
default = 2.2   # Boucherie PROJETTE

[[genes]]
id = "knockback_mult_default"
default = 1.0   # melee / armes sans mapping
