id = "roguelite_loot"
name = "Roguelite Loot Tables MVP"
domain = "Loot"
category = "Loot"
description = "Drop tables weighted rarity (Diablo 3 Loot 2.0 + Path of Exile 2-phase + Hearthstone pity timer). RNG seedé (run_seed, stage_id, encounter_idx). Host-authoritative en coop."
version = "0.1.0"

# === Pity Timer (Hearthstone pattern) ===

[[genes]]
id = "loot_pity_increment_per_dry"
label = "Pity counter increment per dry drop (+% rare chance)"
chromosome = "Pity"
target = "Value"
min = 0.0
max = 0.20
default = 0.05
layer = "roguelite_loot"

[[genes]]
id = "loot_pity_legendary_threshold"
label = "Drops without legendary before guaranteed legendary"
chromosome = "Pity"
target = "Value"
min = 5.0
max = 100.0
default = 40.0
layer = "roguelite_loot"

[[genes]]
id = "loot_smart_loot_bias"
label = "Smart loot bias (% chance to roll player-class-aligned)"
chromosome = "Bias"
target = "Value"
min = 0.0
max = 1.0
default = 0.40
layer = "roguelite_loot"

