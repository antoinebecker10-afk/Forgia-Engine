# roguelite_decor.toml — Story-562b : props GLB Inferno pour remplir l'arène.
#
# Pack Inferno (CC0, volcan) dans assets/models/environment/inferno/. Spawné par
# forgia-mode-roguelite (crate LIBRE), greffé sur l'arène SANS toucher
# forgia-stage. Hot-reload mtime 1Hz.
#
# COHÉRENCE : chaque prop est calibré à une TAILLE CIBLE (m) par groupe via
# mesure AABB runtime (les tailles natives des GLB varient trop). Ajuste les
# `decor_target_*` pour la taille voulue. Colliders auto sur les gros props
# (périmètre) ; petits débris au sol = sans collider (nav bots safe).
# Arène crypts_of_anvil = extent 90 m (POI ~50 m, murs ~90 m).

[[genes]]
id = "decor_enabled"
default = 1.0

# ─── Anneau périmétrique ───────────────────────────────────────────────────────
[[genes]]
id = "decor_ring_radius_min"
default = 42.0

[[genes]]
id = "decor_ring_radius_max"
default = 74.0

# Total props sur l'anneau (landmarks + braseros + gros rochers/piliers).
[[genes]]
id = "decor_perimeter_count"
default = 34.0

# Nombre de LANDMARKS (statue / tour) = points focaux hauts. Pris sur le total.
[[genes]]
id = "decor_landmark_count"
default = 4.0

# Fraction du RESTE de l'anneau qui sont des braseros lumineux.
[[genes]]
id = "decor_brazier_ratio"
default = 0.30

# ─── Petits props dispersés au sol (sans collider) ────────────────────────────
[[genes]]
id = "decor_scatter_count"
default = 55.0

[[genes]]
id = "decor_scatter_radius_min"
default = 12.0

[[genes]]
id = "decor_scatter_radius_max"
default = 72.0

# ─── Tailles cibles (m) par groupe — calibration AABB (cohérence) ─────────────
# Hauteur/taille max visée pour chaque type. C'est ICI qu'on règle l'échelle.
[[genes]]
id = "decor_target_landmark"
default = 16.0

[[genes]]
id = "decor_target_big"
default = 7.0

[[genes]]
id = "decor_target_brazier"
default = 3.5

[[genes]]
id = "decor_target_scatter"
default = 1.6

# ─── Salles en L (murs KayKit dungeon, colliders) ─────────────────────────────
# Coin + 2 bras de mur perpendiculaires, layout OUVERT (bots contournent).
# Mets decor_room_count=0 si les bots se coincent.
[[genes]]
id = "decor_room_count"
default = 4.0

# Longueur de chaque bras (en segments de mur de 1 m).
[[genes]]
id = "decor_room_arm_segments"
default = 6.0

[[genes]]
id = "decor_room_radius_min"
default = 20.0

[[genes]]
id = "decor_room_radius_max"
default = 52.0

# ─── Gravats au sol (masquent la répétition des dalles forgia-stage) ──────────
[[genes]]
id = "decor_rubble_count"
default = 34.0

[[genes]]
id = "decor_target_rubble"
default = 3.4

# ─── Fond « Cratère de la Forge » (incr.1) — hors-map, ÉNORME, sans collider ───
# Anneau lointain de falaises volcaniques (rochers/crags Inferno scalés énormes)
# AU-DELÀ des ramparts (~90 m) → silhouette de cratère à l'horizon. Hauteurs
# variées = crête déchiquetée. + pics géants dominants (« le rocher géant hors map »).
# Règle le radius/taille pour cadrer la skyline. Pure déco lointaine.
[[genes]]
id = "decor_background_count"
default = 44.0

[[genes]]
id = "decor_background_radius_min"
default = 110.0

[[genes]]
id = "decor_background_radius_max"
default = 165.0

# Taille cible (m) des falaises de crête. ÉNORME pour dominer les ramparts ~90 m.
[[genes]]
id = "decor_target_background"
default = 34.0

# Pics géants : peu nombreux, gigantesques, dominent la crête.
[[genes]]
id = "decor_giant_peak_count"
default = 2.0

[[genes]]
id = "decor_giant_peak_radius"
default = 205.0

[[genes]]
id = "decor_target_giant_peak"
default = 80.0

# ─── Cœur de forge (incr.2) : anneau de feu + monuments hauts ─────────────────
# Braseros en anneau autour de l'aire de combat (« ring of fire ») + monuments/
# cheminées hauts encadrant le centre. Rapproche l'ambiance forge du joueur.
# Solides (cover, contournés par les bots). Centre (rayon < forge_ring_radius)
# reste OUVERT pour le combat.
[[genes]]
id = "decor_forge_ring_count"
default = 8.0

[[genes]]
id = "decor_forge_ring_radius"
default = 16.0

[[genes]]
id = "decor_forge_monument_count"
default = 4.0

[[genes]]
id = "decor_forge_monument_radius"
default = 30.0

[[genes]]
id = "decor_forge_monument_target"
default = 18.0

# ─── Ville-forge (incr.3) : ceinture de bâtiments KayKit Medieval Hexagon ─────
# Bâtiments rouges (forge, mine, tours, barracks, ruines...) en anneau FACE au
# centre, dos aux ramparts → skyline de ville. Calibrés à `decor_target_building`.
# Réduis `decor_perimeter_count` si la ville + les rochers font trop chargé.
[[genes]]
id = "decor_building_count"
default = 18.0

[[genes]]
id = "decor_building_radius_min"
default = 52.0

[[genes]]
id = "decor_building_radius_max"
default = 76.0

[[genes]]
id = "decor_target_building"
default = 12.0

# ─── Anti-freeze (story-619 follow-up) : étalement du spawn décor ─────────────
# Le décor est planifié d'un coup mais instancié par budget/frame. Sans ça, ~800
# props GLB s'instancient en 1 frame à l'entrée de stage = freeze de 65 ms. Plus
# haut = remplissage plus rapide mais hitch plus gros ; plus bas = pop-in plus
# long mais 0 freeze. 12/frame ≈ 1,1 s pour ~800 props, chaque frame < 16 ms.
[[genes]]
id = "decor_spawn_budget_per_frame"
default = 12.0
