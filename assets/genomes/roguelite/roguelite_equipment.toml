# roguelite_equipment.toml — Équipement du personnage (Trooper), pièces lootées.
#
# Modèle : le personnage porte une combinaison de base (toujours visible) et
# CINQ pièces d'armure qui se lootent. Chaque pièce améliore UNE statistique de
# combat ; sa RARETÉ — sa couleur — dit de combien.
#
# La couleur est le langage du système : on lit la valeur d'une pièce d'un coup
# d'œil, sans texte. Elle est appliquée en teinte sur le matériau de la pièce,
# donc visible sur le portrait ET sur les gants en jeu.
#
# Source des modèles : `assets/models/characters/trooper/manifest.json`, produit
# par `tools/blender/build_trooper.py` depuis le pack Sci-Fi Trooper Man v3.
# Les `model` d'ici doivent correspondre aux `slots` du manifeste.

version = 1

# Le corps de base — toujours porté, jamais lootable. C'est lui qu'on voit quand
# aucune pièce n'est équipée.
body_model = "models/characters/trooper/body.gltf"

# L'emplacement dont la rareté teinte les BRAS du viewmodel FPS — c'est le seul
# qu'on voie en combat. Le changer ici suffit si un jour les brassards passent
# sur un autre slot.
viewmodel_slot = "gloves"

# Les bras vus en FPS, découpés du MÊME corps que l'avatar 3ᵉ personne. Ils sont
# déclarés ICI et non dans le préchargeur générique d'assets : le choix des bras
# appartient au personnage, pas à une liste de fichiers du moteur. Les vider
# rend les bras d'origine.
viewmodel_arm_left = "models/characters/trooper/viewmodel_arm_l.gltf"
viewmodel_arm_right = "models/characters/trooper/viewmodel_arm_r.gltf"

# ── Raretés ──────────────────────────────────────────────────────────────────
# `bonus_mul` multiplie le gain de base du slot (`per_tier`).
# `drop_weight` = poids de tirage (mêmes ordres de grandeur que roguelite_loot).

[[rarities]]
id = "commun"
label = "Commun"
rgb = [0.62, 0.64, 0.68]
bonus_mul = 1.0
drop_weight = 60.0

[[rarities]]
id = "rare"
label = "Rare"
rgb = [0.32, 0.74, 0.38]
bonus_mul = 2.0
drop_weight = 28.0

[[rarities]]
id = "epique"
label = "Épique"
rgb = [0.28, 0.55, 0.92]
bonus_mul = 3.0
drop_weight = 9.0

[[rarities]]
id = "legendaire"
label = "Légendaire"
rgb = [0.64, 0.34, 0.86]
bonus_mul = 4.0
drop_weight = 2.5

[[rarities]]
id = "mythique"
label = "Mythique"
rgb = [0.95, 0.72, 0.22]
bonus_mul = 5.0
drop_weight = 0.5

# ── Slots ────────────────────────────────────────────────────────────────────
# `stat` ∈ damage | fire_rate | reduction | crit | headshot
# `per_tier` = gain au rang Commun. Mythique donne 5× ce gain (bonus_mul).
#
# L'association slot → stat est un choix de design, pas une contrainte technique :
# elle se change ici, sans toucher au code. Set Mythique complet = dégâts ×1.20,
# cadence ×1.20, 15 % de réduction, 15 % de critique, +0.40 aux tirs à la tête.

[[slots]]
id = "helmet"
label = "Casque"
stat = "headshot"
stat_label = "Visée"
per_tier = 0.08
model = "models/characters/trooper/helmet.gltf"

[[slots]]
id = "chest"
label = "Plastron"
stat = "reduction"
stat_label = "Blindage"
per_tier = 0.03
model = "models/characters/trooper/chest.gltf"

[[slots]]
id = "gloves"
label = "Gants"
stat = "fire_rate"
stat_label = "Cadence"
per_tier = 0.04
model = "models/characters/trooper/gloves.gltf"

[[slots]]
id = "legs"
label = "Jambières"
stat = "damage"
stat_label = "Puissance"
per_tier = 0.04
model = "models/characters/trooper/legs.gltf"

[[slots]]
id = "boots"
label = "Bottes"
stat = "crit"
stat_label = "Critique"
per_tier = 0.03
model = "models/characters/trooper/boots.gltf"

# ── Butin ────────────────────────────────────────────────────────────────────

[drops]
# Une pièce tombe à chaque étage terminé, plus une garantie à la victoire.
per_stage = 1
on_victory = 1
# Un tirage qui donne une pièce déjà possédée est relancé jusqu'à ce nombre de
# fois avant d'être abandonné (anti-doublon léger, sans garantir l'inédit).
reroll_if_owned = 8
# Durée d'affichage de la carte de butin, en secondes. C'est le geste central du
# genre : sans elle, une pièce tombe et le joueur ne l'apprend qu'en ouvrant un
# menu. Assez long pour être lu en plein combat, assez court pour ne pas gêner.
card_seconds = 4.0

# ── Animation de l'avatar ────────────────────────────────────────────────────
# Même modèle que les ennemis (`roguelite_enemy_anim.toml`, story-636) : les clips
# se désignent par leur NOM, jamais par leur index. Un index se décale en silence
# au moindre ré-export ; un nom manquant se signale.
#
# Les clips vivent dans `body_model` uniquement — les pièces d'armure partagent
# son squelette, donc elles n'ont aucune animation à elles.

[animation]
idle_clip = "idle"
walk_clip = "walk"
# Pas encore de clip de course : la marche en tient lieu. À remplacer dès que le
# `Running` Mixamo est intégré (cf. docs/pipeline/mixamo-trooper.md).
run_clip = "walk"

# Fondu entre deux clips. Sans lui, le passage repos → marche est une coupure
# sèche, et c'est ce qui trahit le plus une animation de jeu.
crossfade_ms = 150

# Seuils de vitesse horizontale (m/s) qui décident du clip.
#
# 🚨 Ils se DÉRIVENT de `player_movement.toml` (marche 6,5 · sprint 9,75), ils ne
# se choisissent pas : `0 < walk_speed_min < marche < run_speed_min < sprint`.
#
# `run_speed_min` valait 6,0 — SOUS la vitesse de marche — donc marcher
# déclenchait la course. Invisible ici tant que `run_clip = "walk"`, mais le
# défaut serait réapparu le jour où le trooper aura son vrai clip de course.
# Corrigé le 2026-08-15 en même temps que celui de l'Expédition, où il se voyait.
walk_speed_min = 0.6
run_speed_min = 8.0

# 🚨 Plafond anti-téléport. La vitesse est dérivée du déplacement réel : un
# replacement au spawn produit un pic de plusieurs centaines de m/s et ferait
# courir le personnage à l'arrêt. Même garde-fou que les ennemis.
#
# 15,0 ≈ 1,5 × le sprint. 30 laissait passer des pics mesurés à 29,79 m/s.
max_sane_speed = 15.0

# ── Le personnage de l'Expédition ────────────────────────────────────────────
# Un AUTRE personnage, pas une variante du trooper : son propre squelette (62 os
# en nommage Mixamo) et ses propres clips, fusionnés dans son GLB par
# `tools/assets/merge_gltf_anims.py`.
#
# 🚨 Il ne porte PAS l'armure lootée. Les cinq pièces sont riggées sur les 68 os
# du trooper ; posées sur ce squelette-ci elles suivraient les mauvais joints et
# flotteraient dans le monde — un défaut visible sans être compréhensible. Le
# moteur le sait (`CorpsAvatar::porte_armure`), il n'y a rien à tenter ici.
#
# Clips disponibles dans le GLB : death, hammer_strike, hit_react, idle,
# jog_backward, jump, run, swim, walk. Seuls idle/walk/run sont câblés
# aujourd'hui — les autres attendent un système qui sache quand les jouer.

[expedition_body]
# `stylized_male_complet.glb` avec ses CHEVEUX ANIMÉS. Même corps, mêmes 62 os
# Mixamo, mêmes 9 clips, même cape à l'ourlet ardent, mêmes 4 sockets — plus
# deux os `cheveux_01`/`cheveux_02` dans la masse capillaire, et leur mouvement
# cuit dans les neuf actions existantes.
# Bâti par `tools/blender/personnage/40_cheveux_avatar.py`, rejouable seul.
#
# 🚨 Le mouvement est DANS les clips, pas à côté. Le moteur joue « run » et les
# cheveux suivent : aucun système Rust à écrire, aucun clip additif à mélanger.
# La pointe est en retard de 0,18 tour sur la racine et va 1,35 fois plus loin —
# c'est ce décalage, et lui seul, qui fait qu'une matière a l'air souple.
#
# Mesuré après pesée : à 14°/19° de flexion, le VISAGE ne bouge pas (3,2 mm au
# pire, 0,02 mm en moyenne) pendant que les pointes balaient 82 mm.
#
# 🚨 Il contient DEUX squelettes : celui du corps (64 os) et celui de la cape
# (6 os `cloak_01`…`cloak_06`), donc deux `AnimationPlayer`.
# `sys_bind_avatar_animations` les câble TOUS (il ne s'arrête pas au premier) —
# c'est ce qui rend l'échange sûr. Un brancheur qui s'arrêterait au premier
# lecteur laisserait le corps bras écartés : c'est exactement le défaut qu'a
# produit une autre version.
#
# Autres corps disponibles, sans changement de code :
#   · `stylized_male_complet.glb`  — l'original, cheveux figés
#   · `chien_expedition.glb`       — tête de chien sculptée, oreilles/yeux/
#     mâchoire animés et clignement en morph (chaîne `32`→`39`)
# 2026-08-17 : `_fusil` = strictement `_cheveux` PLUS 25 clips (34 au total,
# 186 canaux chacun, 0 ignoré à la fusion). Rien n'est perdu — mêmes maillages,
# mêmes os, mêmes cheveux — donc le retour en arrière est le nom d'avant.
#
# 🚨 Le jeu « fusil en main » est ce qui compte : `rifle_walk` garde l'arme
# épaulée là où `walk` balance les deux bras librement. Aucun réglage de code ne
# rattrape ça — c'est dans la capture ou ça n'y est pas. Et `rifle_aim` est une
# POSE DE VISÉE capturée, qui remplace ce que l'IK approximait.
#
# Récolté par `tools/assets/mixamo_recolte.py` (manifeste `mixamo_clips.toml`),
# converti et fusionné par `merge_gltf_anims.py`.
model = "models/characters/stylized/stylized_male_fusil.glb"

[expedition_body.animation]
# 🚨 Le jeu « fusil en main » et pas les génériques, pour une raison qui ne se
# rattrape par aucun réglage de code : `walk` balance les deux bras librement,
# `rifle_walk` garde l'arme épaulée. Le personnage PORTE une arme en permanence
# dans ce mode — c'est dans la capture ou ça n'y est pas.
#
# Les 34 clips du corps sont récoltés par `tools/assets/mixamo_recolte.py`
# (manifeste `tools/assets/mixamo_clips.toml`) et fusionnés par
# `merge_gltf_anims.py`. Un nom absent du GLB est signalé au chargement.
idle_clip = "rifle_idle"
walk_clip = "rifle_walk"
run_clip = "rifle_run"
back_clip = "rifle_walk_back"
strafe_clip = "rifle_strafe"

# La visée capturée. Elle porte la POSE ; l'IK des bras porte la DIRECTION (le
# tangage de la caméra), qu'un clip figé ne peut pas suivre. Les deux se
# superposent, et c'est le montage des moteurs du marché.
aim_clip = "rifle_aim"
fire_clip = "rifle_fire"

# En l'air. `fall` séparé de `jump` : sinon on descend en gardant la pose de
# montée, et la carte a des dénivelés de plusieurs mètres.
jump_clip = "jump"
fall_clip = "fall"
land_clip = "land"

# Accroupi (Ctrl gauche). Trois clips, parce qu'une pose figée ne suffit pas dès
# qu'on avance ou qu'on recule en restant baissé.
crouch_idle_clip = "rifle_crouch_idle"
crouch_walk_clip = "rifle_crouch_walk"
crouch_back_clip = "rifle_crouch_back"

# La glissade, qui remplace le dash de l'arène (Shift + Ctrl en courant).
slide_clip = "slide"

# Le virage sur place. Sans lui, pivoter à l'arrêt fait tourner le personnage
# sans que ses pieds bougent — le défaut le plus visible d'une locomotion
# incomplète, après le strafe.
turn_clip = "rifle_turn"

crossfade_ms = 150

# 🚨 CES DEUX SEUILS SE DÉRIVENT DE `player_movement.toml`, ils ne se choisissent
# pas. Le joueur n'a que trois vitesses :
#
#     arrêt 0 · marche `speed` = 6,5 · sprint `speed × sprint_multiplier` = 9,75
#
# Les seuils doivent donc les SÉPARER :
#
#     0 < walk_speed_min < 6,5 < run_speed_min < 9,75
#
# Défaut corrigé le 2026-08-15 : `run_speed_min` valait **6,0**, c'est-à-dire
# SOUS la vitesse de marche. Marcher déclenchait donc `run`, et le clip `walk` —
# pourtant présent dans le GLB — était INATTEIGNABLE. Rapporté en jeu : « les
# animations ne fonctionnent pas correctement ».
#
# 8,0 tombe entre 6,5 et 9,75. Un test lit les DEUX génomes et vérifie
# l'encadrement : voir `les_seuils_d_animation_separent_les_vitesses_du_joueur`.
walk_speed_min = 0.6
run_speed_min = 8.0

# Plafond anti-téléport, lui aussi dérivé : au-delà de ~1,5 × la vitesse de
# sprint, ce n'est plus du déplacement, c'est un replacement. 30 laissait passer
# des pics mesurés à 29,79 m/s (capteur `vitesse_max_vue_mps`), qui faisaient
# courir le personnage sur place au spawn.
max_sane_speed = 15.0

# Pas de section de cadrage pour l'aperçu 3D : il est rendu hors écran
# (`forgia_ui::weapon_preview`, comme les bras et les armes) et se cadre TOUT
# SEUL sur l'emprise réelle du personnage. Un réglage de distance/hauteur ici
# serait une valeur à maintenir en double avec la géométrie.
