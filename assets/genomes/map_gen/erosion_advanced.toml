id = "erosion_advanced"
name = "Advanced Erosion"
domain = "Terrain"
category = "Custom"
description = "Hydraulic erosion, noise variety (Ridged, Worley, Billow), terrain destructibility"
version = "1.0.0"

# === Hydraulic Erosion ===
[[genes]]
id = "hydro_enabled"
label = "Hydraulic Erosion"
chromosome = "Hydraulic"
target = "Value"
min = 0.0
max = 1.0
default = 1.0
layer = "hydraulic"

[[genes]]
id = "hydro_iterations"
label = "Droplet Iterations"
chromosome = "Hydraulic"
target = "Value"
min = 1000.0
max = 100000.0
default = 80000.0  # AAA: 4x more droplets for visible drainage networks
layer = "hydraulic"

[[genes]]
id = "hydro_droplet_inertia"
label = "Droplet Inertia"
chromosome = "Hydraulic"
target = "Value"
min = 0.0
max = 1.0
default = 0.18  # AAA: more winding paths (was 0.05)
layer = "hydraulic"

[[genes]]
id = "hydro_sediment_capacity"
label = "Sediment Capacity"
chromosome = "Hydraulic"
target = "Value"
min = 1.0
max = 20.0
default = 6.0  # Carries more sediment (was 4.0)
layer = "hydraulic"

[[genes]]
id = "hydro_deposition_rate"
label = "Deposition Rate"
chromosome = "Hydraulic"
target = "Value"
min = 0.01
max = 0.5
default = 0.10  # Slower filling = deeper valleys (was 0.15)
layer = "hydraulic"

[[genes]]
id = "hydro_erosion_rate"
label = "Hydraulic Erosion Rate"
chromosome = "Hydraulic"
target = "Value"
min = 0.01
max = 0.5
default = 0.22  # Realistic carving (was 0.35 = too aggressive, parallel gullies)
layer = "hydraulic"

[[genes]]
id = "hydro_evaporation"
label = "Evaporation Rate"
chromosome = "Hydraulic"
target = "Value"
min = 0.001
max = 0.1
default = 0.008  # Slower evaporation = longer rivers (was 0.01)
layer = "hydraulic"

[[genes]]
id = "hydro_droplet_lifetime"
label = "Max Droplet Steps"
chromosome = "Hydraulic"
target = "Value"
min = 10.0
max = 100.0
default = 64.0  # AAA: longer drainage networks (was 30)
layer = "hydraulic"

[[genes]]
id = "hydro_brush_radius"
label = "Erosion Brush Radius"
chromosome = "Hydraulic"
target = "Value"
min = 1.0
max = 8.0
default = 3.0
layer = "hydraulic"

