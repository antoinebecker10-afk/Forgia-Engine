id = "path_default"
name = "Path Network"
domain = "World"
category = "Custom"
description = "Procedural path network: width, depression, shortcuts, Bezier curves"
version = "1.0.0"

[[genes]]
id = "path_half_width"
label = "Path Half-Width"
chromosome = "Geometry"
target = "Value"
min = 3.0
max = 15.0
default = 7.0
layer = "structure"

[[genes]]
id = "path_blend"
label = "Edge Blend"
chromosome = "Geometry"
target = "Value"
