[[genes]]
id = "shortcut_max_dist"
label = "Shortcut Max Distance"
chromosome = "Network"
target = "Value"
min = 50.0
max = 400.0
default = 200.0
layer = "network"

[[genes]]
id = "shortcut_prob"
label = "Shortcut Probability"
chromosome = "Network"
target = "Value"
min = 0.0
max = 1.0
