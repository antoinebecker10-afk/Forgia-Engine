# Template skeleton Humanoid A-POSE — 20 bones (variante arms-down).
# Story-601 incr.1 — pour les meshes générés bras le long du corps (assets IA
# type Meshy/Tripo, ex. Cyber.glb) au lieu de la T-pose Vitruvienne de
# `skeleton_humanoid.toml`. Source de vérité `forgia-skeleton-template`.
# Hot-reloadable via Bevy AssetServer (Shift+F12) — TUNER les positions de bras
# à l'œil sur le mesh cible (overlay rig ON en CyberCity).
#
# Différences vs skeleton_humanoid.toml :
#  - bras qui DESCENDENT (Y décroissant, X proche du corps) au lieu d'horizontaux
#  - stance_offsets À ZÉRO : le mesh est déjà en pose game (arms-down), aucune
#    rotation à appliquer (cf skeleton_humanoid.toml:6-8).

[stance_offsets]
arm_l_euler_deg = [0.0, 0.0, 0.0]
arm_r_euler_deg = [0.0, 0.0, 0.0]
leg_l_euler_deg = [0.0, 0.0, 0.0]
leg_r_euler_deg = [0.0, 0.0, 0.0]
spine_euler_deg = [0.0, 0.0, 0.0]
hip_euler_deg   = [0.0, 0.0, 0.0]
clavicle_l_euler_deg = [0.0, 0.0, 0.0]
clavicle_r_euler_deg = [0.0, 0.0, 0.0]

# Position normalisée : `pos = [x, y, z]`, y∈[0,1] (0=sol, 1=top), scalé par
# mesh_height au runtime. `parent` = index 0-based. `class` = anatomie déclarative.

[[bones]]
name = "hip"
pos = [0.0, 0.50, 0.0]
class = "spine"

[[bones]]
name = "spine_lower"
parent = 0
pos = [0.0, 0.58, 0.0]
class = "spine"

[[bones]]
name = "spine_mid"
parent = 1
pos = [0.0, 0.66, 0.0]
class = "spine"

[[bones]]
name = "chest"
parent = 2
pos = [0.0, 0.75, 0.0]
class = "spine"

[[bones]]
name = "neck"
parent = 3
pos = [0.0, 0.85, 0.0]
class = "spine"

[[bones]]
name = "head"
parent = 4
pos = [0.0, 0.95, 0.0]
class = "head"

