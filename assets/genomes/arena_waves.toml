# Forgia V2 — Arena Waves Genome
# Wave system progressif : training → boss. Hot-reloadable.
#
# Modifiers (par wave, multiplicateurs sur arena_bots.toml.ai) :
# - hp_mult : multiplie hp (template = 100)
# - ai_cooldown_mult : multiplie shot_cooldown_secs (<1.0 = plus rapide)
# - ai_damage_mult : multiplie shot_damage

break_secs = 4.0           # pause entre vagues
final_wave_index = 5       # wave finale (boss)


# ─── WAVE 1 — Roster complet (5 bots, training) ───────────────
[[wave]]
index = 1
hp_mult = 1.0
ai_cooldown_mult = 1.2          # plus lent pour onboarding
ai_damage_mult = 0.8
[[wave.spawns]]
character_glb = "models/characters/Dorin.glb#Scene0"
character_yaw_deg = 180.0
character_y_offset = 0.9
x = -4.0
z = -7.0
