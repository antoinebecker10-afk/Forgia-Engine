target = "Value"
min = 0.0
max = 90.0
default = 30.0
layer = "placement"

# Constraints
[[constraints]]
source = "veg_density_global"
target = "veg_per_chunk"
ratio = 30.0

# V4 hysteresis : show <= hide (anti-flicker)
[[constraints]]
source = "veg_accent_cull_show"
target = "veg_accent_cull_hide"
ratio = 1.0

[[constraints]]
source = "veg_per_chunk"
target = "veg_max_total_base"
ratio = 16.0

[[constraints]]
source = "veg_scale_min"
target = "veg_min_spacing"
ratio = 2.0

[[constraints]]
source = "veg_proc_iterations"
target = "veg_proc_branch_angle"
ratio = -3.0
