# === Per-Category Cull Distances (Vague 4 — story-412) ===
# Accent cull etait le seul hardcode dans `PlacementCategory::cull_distances_*`,
# les autres categories (Tree/Bush/Ground) utilisaient deja FpsTuning. Asymetrie
# casse vague 4. `show <= hide` invariant force par constraint.
[[genes]]
id = "veg_accent_cull_hide"
label = "Accent Cull Hide"
chromosome = "Performance"
target = "Value"
min = 50.0
max = 400.0
default = 150.0
layer = "performance"

[[genes]]
id = "veg_accent_cull_show"
label = "Accent Cull Show"
chromosome = "Performance"
target = "Value"
min = 30.0
max = 380.0
default = 135.0
layer = "performance"

# === Per-Category Max Slope (Vague 4) ===
# Hardcodes elimines dans `PlacementCategory::max_slope_deg()`. Slope max =
# pente maximale (degres) au-dessus de laquelle un asset de cette categorie
# n'est plus place.
[[genes]]
id = "veg_tree_max_slope"
label = "Tree Max Slope (deg)"
chromosome = "Placement"
target = "Value"
min = 0.0
max = 90.0
default = 35.0
layer = "placement"

[[genes]]
id = "veg_bush_max_slope"
label = "Bush Max Slope (deg)"
chromosome = "Placement"
target = "Value"
min = 0.0
max = 90.0
default = 45.0
layer = "placement"

[[genes]]
