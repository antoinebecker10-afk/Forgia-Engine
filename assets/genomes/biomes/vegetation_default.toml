# Total vegetation cap (base) — multiplied by graphics_settings.vegetation_density.
# Pre-M7 W3 : 3500 (multi-primitive GLB blow up x3-4, safe under entity_budget 15000).
# Post-M7 W3 : raise to 30000+ once GPU instance buffer lands (story-348).
# Hot-reloadable via Shift+F12 for stress tests.
[[genes]]
id = "veg_max_total_base"
label = "Vegetation total base cap"
chromosome = "Density"
target = "Value"
min = 1500.0
max = 50000.0
default = 3500.0
layer = "density"

