[[genes]]
id = "faubourg_radius_offset"
label = "Faubourg Radius Offset"
chromosome = "Faubourg"
target = "Value"
# 2026-04-19 : 70 → 100. Avec wall_radius passé de 120 → 160, le faubourg
# doit s'étendre plus loin pour créer une vraie "ville extérieure". 100m
# d'offset = faubourg entre 160-260m du centre = ceinture village de 100m.
min = 30.0
max = 150.0
default = 100.0
layer = "layout"

# Cathedral compound — meta-parameters for the central structure
[[genes]]
id = "cathedral_density"
label = "Densite Cathedrale"
chromosome = "Cathedral"
target = "Value"
min = 0.3
max = 2.0
default = 1.3
layer = "layout"
# Controls: buttress_count, cloister_count, balustrade_count, parvis columns

[[genes]]
id = "cathedral_spire_offset"
label = "Spire Offset"
chromosome = "Cathedral"
target = "Value"
# 2026-04-19 : 14 → 4. Avec WC_BLD_MAIN scaled à 40×0.375=15m wide
# + TOWER scaled à 16×0.375=6m wide, spire offset doit rester proche du
# main (4m offset = la flèche est attachée au flanc de la cathédrale,
# pas séparée à 14m de distance).
min = 2.0
max = 10.0
default = 4.0
layer = "layout"

[[genes]]
id = "cathedral_wing_spread"
label = "Wing Spread"
chromosome = "Cathedral"
target = "Value"
# 2026-04-19 : 16 → 8. Cathédrale main 22m tall × 14m wide, wings doivent
# être adjacents pour faire la croix cohérente. 8m offset = les wings
# collent aux flancs nord/sud.
min = 4.0
max = 14.0
default = 8.0
layer = "layout"

[[genes]]
id = "cathedral_elevated_height"
label = "Elevated Height"
chromosome = "Cathedral"
target = "Value"
min = 6.0
max = 18.0
default = 10.0
layer = "layout"

