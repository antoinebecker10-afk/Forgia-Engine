# WhiteCastle piece scales (relative to donjon_scale)
[[genes]]
id = "wc_building_scale"
label = "Building Scale"
chromosome = "WhiteCastle"
target = "Value"
# 2026-04-19 (v3) : 0.60 → 0.25 basé sur mesures Blender.
# WC_BLD_MAIN natif = 40×58×36m (58m tall !). WC_BLD_TOWER natif = 16×72×28m.
# Ancien 0.60 × donjon 1.5 = 0.90 → cathédrale 52m tall, flèche 65m = gigantesque.
# Nouveau 0.25 × donjon 1.5 = 0.375 → cathédrale 21.6m, flèche 27m = monument
# lisible mais pas écrasant. Ground_offset_y mesuré (1.996m × 0.375 = 0.75m)
# maintenant appliqué dans Phase 7 pour poser la base exactement au sol.
min = 0.15
max = 0.6
default = 0.25
layer = "whitecastle"

[[genes]]
id = "wc_gate_scale"
label = "Gate Scale"
chromosome = "WhiteCastle"
target = "Value"
min = 0.5
max = 1.2
default = 0.80
layer = "whitecastle"

[[genes]]
id = "wc_column_scale"
label = "Column Scale"
chromosome = "WhiteCastle"
target = "Value"
min = 0.4
max = 1.0
