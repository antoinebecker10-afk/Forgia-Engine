label = "Well Scale"
chromosome = "WhiteCastle"
target = "Value"
min = 4.0
max = 12.0
default = 8.0
layer = "whitecastle"

[[genes]]
id = "portal_scale"
label = "Portal Scale"
chromosome = "WhiteCastle"
target = "Value"
min = 2.0
max = 8.0
default = 4.0
layer = "whitecastle"

[[genes]]
id = "portal_height"
