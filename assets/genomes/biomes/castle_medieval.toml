# Faubourg — outer village ring
[[genes]]
id = "faubourg_density"
label = "Faubourg Density"
chromosome = "Faubourg"
target = "Value"
# 2026-04-19 : 0.7 → 0.95. Le château paraissait "perdu au milieu de rien"
# car le faubourg autour était sparse. 0.95 = ceinture dense de maisons
# autour des murs → contexte "ville vivante" au lieu de "forteresse isolée".
min = 0.0
max = 1.0
default = 0.95
layer = "layout"

