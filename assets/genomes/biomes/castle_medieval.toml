chromosome = "WhiteCastle"
target = "Value"
min = 0.5
max = 3.0
default = 1.5
layer = "whitecastle"

[[genes]]
id = "faubourg_building_mult"
label = "Faubourg Buildings Mult"
chromosome = "Faubourg"
target = "Value"
# 2026-04-19 : 40 → 60. Augmente le nombre de maisons de village dans
# la ceinture faubourg pour un vrai feel "capitale médiévale peuplée".
min = 20.0
max = 100.0
default = 60.0
layer = "layout"

