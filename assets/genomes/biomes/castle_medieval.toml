id = "castle_medieval"
name = "Medieval Capital"
domain = "Building"
category = "Building"
description = "Procedural medieval capital: massive walls, cathedral, 8 districts, faubourg, bridges"
version = "4.0.0"

# Structure — overall layout (Capital scale)
[[genes]]
id = "wall_radius"
label = "Wall Radius"
chromosome = "Structure"
target = "Value"
# 2026-04-19 : 120 → 160. Plus d'espace intérieur → bâtiments (scale 0.6)
# respirent entre les murs. Évite l'effet "ville étouffée" de 120m.
min = 40.0
max = 250.0
default = 160.0
layer = "structure"

[[genes]]
id = "wall_height"
label = "Wall Height"
chromosome = "Structure"
target = "Value"
# 2026-04-19 : 10.0 → 2.0 basé sur mesures Blender.
# KayKit wall native = 4×4×1m. Ancien code : scale = wall_height×0.625×0.75 =
# 4.69 → murs 18.75m wide = absurde (monstre géant). Nouveau : scale ~0.94
# → murs 3.76m wide, échelle médiévale réaliste.
# Formule : wall_height × 0.625 × 0.75 ≈ scale_effectif.
min = 1.0
max = 6.0
default = 2.0
layer = "structure"

[[genes]]
id = "wall_thickness"
label = "Wall Segments"
chromosome = "Structure"
target = "Value"
min = 0.0
max = 1.0
default = 0.5
layer = "structure"

[[genes]]
id = "gate_count"
label = "Gate Count"
chromosome = "Structure"
target = "Value"
min = 2.0
max = 8.0
default = 4.0
layer = "structure"

