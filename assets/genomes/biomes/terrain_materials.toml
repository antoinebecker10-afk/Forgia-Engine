# === Stone Mesh Wetness (applied to GLB StandardMaterials tagged StoneSurface) ===
# Permanent subtle wet look on castle walls / cobblestone / brick meshes.
# WoW Durotar feel: roughness reduced + albedo slightly darkened.
[[genes]]
id = "mat_stone_wetness_roughness_mult"
label = "Stone Mesh Wet Roughness"
chromosome = "Layers"
target = "Value"
min = 0.3
max = 1.0
default = 0.7
layer = "layers"

[[genes]]
id = "mat_stone_albedo_darkening"
label = "Stone Mesh Wet Darkening"
chromosome = "Layers"
target = "Value"
min = 0.6
max = 1.0
default = 0.9
layer = "layers"

