id = "terrain_materials"
name = "Terrain Material Layers"
domain = "Terrain"
category = "Custom"
description = "Material layers: PBR textures, moss/snow/wet/rust overlays, triplanar blending, weathering"
version = "1.0.0"

# === Triplanar Texturing ===
[[genes]]
id = "mat_triplanar_enabled"
label = "Triplanar Enabled"
chromosome = "Triplanar"
target = "Value"
min = 0.0
max = 1.0
default = 1.0
layer = "triplanar"

[[genes]]
id = "mat_triplanar_sharpness"
label = "Triplanar Blend Sharpness"
chromosome = "Triplanar"
target = "Value"
min = 1.0
max = 16.0
default = 8.0
layer = "triplanar"

[[genes]]
id = "mat_texture_scale"
label = "Texture UV Scale"
chromosome = "Triplanar"
target = "Value"
min = 0.01
max = 0.5
default = 0.1
layer = "triplanar"

[[genes]]
id = "mat_detail_texture_scale"
label = "Detail UV Scale (close-up)"
chromosome = "Triplanar"
target = "Value"
min = 0.1
max = 2.0
default = 0.5
layer = "triplanar"

[[genes]]
id = "mat_detail_blend_start"
label = "Detail Blend Start (m)"
chromosome = "Triplanar"
target = "Value"
min = 0.0
max = 20.0
default = 5.0
layer = "triplanar"

[[genes]]
id = "mat_detail_blend_end"
label = "Detail Blend End (m)"
chromosome = "Triplanar"
target = "Value"
min = 5.0
max = 50.0
default = 20.0
layer = "triplanar"

