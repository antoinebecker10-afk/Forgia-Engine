# === Cap (Vague 2) ===
[[genes]]
id = "grass_max_chunks_total"
label = "Max Grass Chunks"
chromosome = "Performance"
target = "Value"
min = 30.0
max = 500.0
default = 120.0
layer = "performance"

# === Culling ===
# story-407 vague 1A : split into hide/show distances for proper hysteresis.
# `hide` = beyond this distance → grass invisible. `show` = come back into view
# at this closer distance. Gap = anti-flicker hysteresis (~10m default).
[[genes]]
id = "grass_cull_hide"
label = "Cull Hide Distance"
chromosome = "Performance"
target = "Value"
min = 30.0
max = 200.0
default = 70.0
layer = "performance"

[[genes]]
id = "grass_cull_show"
label = "Cull Show Distance"
chromosome = "Performance"
target = "Value"
min = 20.0
max = 180.0
default = 60.0
layer = "performance"

# Constraints
[[constraints]]
source = "grass_blade_height_min"
target = "grass_blade_height_max"
ratio = 1.5

[[constraints]]
source = "grass_blade_height_max"
target = "grass_spacing"
ratio = 0.3

# Hysteresis : show < hide always (anti-flicker)
[[constraints]]
source = "grass_cull_show"
target = "grass_cull_hide"
ratio = 1.0
