# ambient 0.25, diffuse coef 0.55, AO floor 0.35, self_shadow floor 0.85.
[[genes]]
id = "grass_ambient"
label = "Ambient Light"
chromosome = "Lighting"
target = "Value"
min = 0.0
max = 0.6
default = 0.25
layer = "lighting"

[[genes]]
id = "grass_diffuse"
label = "Diffuse Coefficient"
chromosome = "Lighting"
target = "Value"
min = 0.2
max = 1.5
default = 0.55
layer = "lighting"

[[genes]]
id = "grass_ao_floor"
label = "Ground AO Floor"
chromosome = "Lighting"
target = "Value"
min = 0.0
max = 0.7
default = 0.35
layer = "lighting"

[[genes]]
id = "grass_self_shadow_floor"
label = "Self Shadow Floor"
chromosome = "Lighting"
target = "Value"
min = 0.5
max = 1.0
default = 0.85
layer = "lighting"

