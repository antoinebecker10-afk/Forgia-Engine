# === Visual Variation (Vague 2) ===
[[genes]]
id = "grass_color_brightness_min"
label = "Color Brightness Min"
chromosome = "Visual"
target = "Value"
min = 0.3
max = 1.0
default = 0.80
layer = "visual"

[[genes]]
id = "grass_color_brightness_max"
label = "Color Brightness Max"
