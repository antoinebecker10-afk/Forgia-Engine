id = "grass_default"
name = "Procedural Grass"
domain = "Vegetation"
category = "Custom"
description = "3D grass blades: globals only (geometry, wind sway, physics). Per-biome density/color live in biome_*.toml via BiomeRegistry."
version = "1.1.0"

# === Blade Geometry ===
[[genes]]
id = "grass_blade_height_min"
label = "Min Blade Height"
chromosome = "Geometry"
target = "Value"
min = 0.1
max = 1.5
default = 0.4
layer = "geometry"

[[genes]]
id = "grass_blade_height_max"
label = "Max Blade Height"
chromosome = "Geometry"
target = "Value"
min = 0.3
max = 3.0
default = 1.5
layer = "geometry"

[[genes]]
id = "grass_blade_width"
label = "Blade Width"
chromosome = "Geometry"
target = "Value"
min = 0.02
max = 0.3
default = 0.06
layer = "geometry"

# AAA tuning 2026-04-28 : spacing 0.4→0.20 (×4 brins, ~25/m² vs ~10/m² avant).
# Compensé par cull_distance 90→70 pour budget perf constant.
# Pour 100+/m² réaliste, attendre M7 GPU instancing (story-348).
[[genes]]
id = "grass_spacing"
label = "Blade Spacing"
chromosome = "Geometry"
target = "Value"
min = 0.1
max = 2.0
default = 0.20
layer = "geometry"

# === Wind Interaction ===
[[genes]]
id = "grass_wind_sway_amp"
label = "Wind Sway Amplitude"
chromosome = "Wind"
target = "Value"
min = 0.0
max = 0.5
default = 0.25
layer = "wind"

[[genes]]
id = "grass_wind_sway_freq"
label = "Wind Sway Frequency"
chromosome = "Wind"
target = "Value"
min = 0.1
max = 3.0
default = 1.0
layer = "wind"

# === Player Interaction ===
[[genes]]
id = "grass_crush_radius"
label = "Crush Radius"
chromosome = "Physics"
target = "Value"
min = 0.5
max = 5.0
default = 2.0
layer = "physics"

[[genes]]
id = "grass_spring_back_secs"
label = "Spring Back Time"
chromosome = "Physics"
target = "Value"
min = 0.3
max = 5.0
default = 1.5
layer = "physics"

# === Lighting (Vague 3C — 2026-05-05) ===
