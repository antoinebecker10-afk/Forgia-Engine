# === Constraints ===

# More pellets → wider spread
[[constraints]]
source = "shotgun_pellets"
target = "shotgun_spread_deg"
ratio = 0.5

# More pellets → less damage per pellet
[[constraints]]
source = "shotgun_pellets"
target = "shotgun_damage"
ratio = -0.3

# Higher damage → more recoil
[[constraints]]
source = "shotgun_damage"
target = "shotgun_recoil_kick_up"
ratio = 0.004

# Slower fire rate → more range (pump action = tighter choke)
[[constraints]]
source = "shotgun_fire_rate"
target = "shotgun_range"
ratio = 10.0
