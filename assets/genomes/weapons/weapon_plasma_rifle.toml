# === Constraints ===

# Higher damage → slower projectile (energy conservation)
[[constraints]]
source = "plasma_damage"
target = "plasma_speed"
ratio = -0.5

# Faster fire rate → wider spread (heat buildup)
[[constraints]]
source = "plasma_fire_rate"
target = "plasma_spread_deg"
ratio = -5.0

# Higher speed → more range
[[constraints]]
source = "plasma_speed"
target = "plasma_range"
ratio = 3.0

# Higher damage → more recoil
[[constraints]]
source = "plasma_damage"
target = "plasma_recoil_kick_up"
ratio = 0.001
