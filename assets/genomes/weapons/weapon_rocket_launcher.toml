# === Constraints ===

# More damage → bigger splash
[[constraints]]
source = "rocket_damage"
target = "rocket_splash_radius"
ratio = 0.05

# Bigger splash → slower fire rate (heavier warhead)
[[constraints]]
source = "rocket_splash_radius"
target = "rocket_fire_rate"
ratio = 0.15

# More damage → more recoil
[[constraints]]
source = "rocket_damage"
target = "rocket_recoil_kick_back"
ratio = 0.001

# Narrower scope FOV → higher sensitivity
[[constraints]]
source = "rocket_scope_fov_deg"
target = "rocket_scope_sensitivity"
ratio = -0.005
