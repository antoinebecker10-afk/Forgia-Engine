[[genes]]
id = "sky_mie_scale"
label = "Mie Scattering Scale"
chromosome = "SkyPhysics"
target = "Value"
min = 0.1
max = 5.0
# 2026-04-26 (story-350 cartoon) : 1.0 → 0.5 (-50%). Halo solaire moins fort,
# différence vers/dos soleil moins marquée — couleurs uniformes toutes directions.
default = 0.5
layer = "sky_physics"

[[genes]]
id = "sky_mie_direction"
label = "Mie Direction (anisotropy)"
chromosome = "SkyPhysics"
target = "Value"
min = 0.0
max = 0.999
# 2026-04-26 (story-350 cartoon) : 0.76 → 0.45 (-40%). Mie moins directionnel,
# scattering plus uniforme — élimine l'effet "contre-jour délavé" en regardant le soleil.
default = 0.45
layer = "sky_physics"

[[genes]]
