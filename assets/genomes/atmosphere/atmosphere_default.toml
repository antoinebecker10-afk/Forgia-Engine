# ─── Atmosphere scattering density multiplier ─────────────────────────────
# 0.15 = 85% transparent → Skybox sky_129 perce à travers. 1.0 = Earth full.
[[genes]]
id = "sky_scattering_density_mult"
label = "Atmosphere Density"
chromosome = "Atmosphere"
target = "Value"
min = 0.05
max = 1.5
default = 0.15
layer = "atmosphere"

# ─── AutoExposure range (camera eye adapt) ────────────────────────────────
# Linear lerp entre range_night (day_factor=0) et range_day (day_factor=1).
# range_day upper large permet brighten en cave→exterior. range_night upper
# petit empêche eye-boost qui rendrait la nuit daylight-like.
[[genes]]
id = "cam_autoexp_range_day_lower"
label = "AutoExp Day Lower EV"
chromosome = "AutoExposure"
target = "Value"
min = -8.0
max = 0.0
default = -4.0
layer = "autoexposure"

[[genes]]
id = "cam_autoexp_range_day_upper"
label = "AutoExp Day Upper EV"
chromosome = "AutoExposure"
target = "Value"
min = 4.0
max = 14.0
default = 10.0
layer = "autoexposure"

[[genes]]
id = "cam_autoexp_range_night_upper"
label = "AutoExp Night Upper EV"
chromosome = "AutoExposure"
target = "Value"
min = 0.0
max = 8.0
default = 4.0
layer = "autoexposure"

# Constraints
[[constraints]]
source = "fog_density_terrain"
target = "ambient_brightness"
ratio = -200.0

[[constraints]]
source = "bloom_intensity"
target = "bloom_low_freq_boost"
ratio = 2.0

[[constraints]]
source = "sky_rayleigh_scale"
target = "sky_mie_scale"
ratio = 0.5
