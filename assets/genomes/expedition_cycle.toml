# Forgia V2 — Le cycle jour/nuit d'une expédition
#
# « Plus je me rapproche du village, plus il fait nuit, et à la fin on voit
# encore un peu mais c'est sombre. Pas mode horreur. »
#
# ⚠️ LA NUIT TOMBE AVEC LA DISTANCE, PAS AVEC LE TEMPS. C'est la marche qui fait
# descendre le soleil : au départ il est haut, au village il est sous l'horizon.
# Un joueur qui traîne ne se retrouve donc pas dans le noir sur place, et un
# joueur rapide voit quand même la nuit tomber — le trajet EST le cycle.
#
# La progression se lit sur le chemin autoré (91 points, 359,8 m) : on projette
# le joueur dessus et on prend la fraction d'abscisse curviligne parcourue.
# Aucune horloge, donc aucune dérive entre deux parties.

[cycle]

# ── Le soleil ────────────────────────────────────────────────────────────────

# Élévation du soleil au DÉPART (degrés au-dessus de l'horizon).
#
# 32° = milieu d'après-midi. Assez haut pour que le relief se lise et que les
# ombres portent sans écraser, assez bas pour qu'on sente déjà la journée
# décliner — on part en fin de journée, on n'arrive pas à midi.
soleil_depart_deg = 32.0

# Élévation à l'ARRIVÉE (négatif = sous l'horizon).
#
# −8° est le crépuscule civil : le soleil est couché mais le ciel diffuse encore.
# C'est exactement « on voit encore un peu mais c'est sombre ». Descendre à −18°
# (nuit astronomique) donnerait le noir total, donc le mode horreur qu'on ne veut
# pas.
soleil_arrivee_deg = -8.0

# Azimut du soleil au départ et à l'arrivée (degrés).
#
# Il tourne de 48° pendant la marche : c'est ce qui fait BOUGER les ombres.
# Sans rotation d'azimut le soleil descendrait tout droit, ce qui ne se lit pas
# comme un coucher — les ombres s'allongeraient sans jamais pivoter.
#
# Le chemin va d'ouest en est ; le soleil part donc dans le dos du joueur et
# finit devant lui, ce qui met le village à contre-jour au moment où on l'atteint.
soleil_azimut_depart_deg = 250.0
soleil_azimut_arrivee_deg = 298.0

# Puissance du soleil (lux) au départ et à l'arrivée.
#
# 11 000 lux = fin d'après-midi couvert. À 70 lux, le direct n'est plus qu'un
# souvenir : ce qui éclaire encore, c'est le ciel et les braseros du chemin.
# C'est voulu — c'est ce qui donne son rôle aux feux.
soleil_lux_depart = 11000.0
soleil_lux_arrivee = 70.0

# ── La lumière du ciel ───────────────────────────────────────────────────────

# Ambiante (lux) au départ et à l'arrivée.
#
# ★ `ambiante_arrivee_lux` EST LE PLANCHER DE LISIBILITÉ. C'est lui qui garantit
# « on voit encore un peu ». Le mettre à 0 donnerait le noir absolu dès que le
# soleil passe sous l'horizon — le mode horreur écarté explicitement.
#
# 110 lux ≈ une nuit claire de pleine lune, sans rehaussement. On distingue le
# relief et une silhouette à une dizaine de mètres, plus au-delà. Descendu de 320
# le 2026-08-14 sur demande (« accentuer la nuit »).
#
# 🚨 Le code borne cette valeur à 60 lux MINIMUM, quoi qu'on écrive ici. C'est le
# seul rempart contre un génome qui éteindrait la carte, et il ne se contourne
# pas depuis ce fichier.
ambiante_depart_lux = 900.0
ambiante_arrivee_lux = 110.0

# ── Le brouillard ────────────────────────────────────────────────────────────
#
# Il se resserre avec la nuit : c'est lui qui fait sentir l'enfermement sans
# baisser la lumière. Jouer sur la portée plutôt que sur la luminosité est ce qui
# distingue « le soir tombe » de « on n'y voit plus rien ».

# Début et fin du fondu (m) au départ de l'expédition.
brouillard_debut_depart_m = 90.0
brouillard_fin_depart_m = 420.0
# Et à l'arrivée — deux fois plus serré.
brouillard_debut_arrivee_m = 35.0
brouillard_fin_arrivee_m = 180.0

# ── La courbe ────────────────────────────────────────────────────────────────

# Exposant appliqué à la progression avant interpolation.
#
# ★ Il décide QUAND la nuit tombe, pas à quel point elle est noire — ça, c'est
# `ambiante_arrivee_lux`. Deux réglages distincts, souvent confondus.
#
# Ce qu'il donne à mi-chemin, mesuré :
#
#   exposant 1,8  → 29 % de l'assombrissement fait   (la nuit attend le dernier tiers)
#   exposant 1,5  → 35 %
#   exposant 1,3  → 41 %
#   exposant 1,15 → 45 %                             ← ici
#   exposant 1,0  → 50 %                             (linéaire, plancher du code)
#
# Passé de 1,8 à 1,15 le 2026-08-14 sur demande (« faire débuter la nuit plus
# tôt »). Le soir s'installe désormais dès la première moitié du trajet au lieu
# d'attendre l'approche du village.
#
# Le code borne l'exposant à [1 ; 4]. Sous 1 la lumière chuterait dès le premier
# pas — un fondu d'écran, pas un coucher de soleil.
courbe_exposant = 1.15
