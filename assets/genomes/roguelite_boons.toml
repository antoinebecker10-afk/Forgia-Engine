# ═══════════════════════════════════════════════════════════════════════════
# Story-680 cran 5 — des atouts qui CHANGENT LA FAÇON DE JOUER
# ═══════════════════════════════════════════════════════════════════════════
#
# L'audit de progression : « cinq systèmes, un seul verbe — multiplier ». Sur les
# 18 atouts d'origine, 14 étaient des statistiques et les 4 restants (2 Chaîne,
# 2 Impact) étaient MORTS — `chain_extra_targets` et `knockback_strength` étaient
# calculés et personne ne les lisait. Les deux exceptions ne fonctionnaient pas.
#
# Les deux mécaniques sont réparées (`chain.rs`, `combat_juice.rs`). On les peuple
# maintenant — et SEULEMENT elles. Ajouter dix atouts « +X % dégâts » aurait
# multiplié le même non-choix ; ce qu'il manquait, ce sont des décisions.
#
# Ces atouts se répondent : la Chaîne récompense de tirer AU MILIEU du groupe,
# l'Impact récompense de le DISPERSER. Les jouer ensemble demande d'arbitrer,
# pas d'empiler.

