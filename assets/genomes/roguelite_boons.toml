# ── Ricochet : le tag existait sans mécanique ───────────────────────────────
# Le tag `ricochet` n'avait que 2 atouts tirables — sa synergie (3 requis) était
# INATTEIGNABLE, donc le jeu promettait une combinaison impossible à construire.
# Et il n'existe aucun effet « ricochet » dans le moteur : le tag nommait une
# fantaisie que rien ne livrait.
#
# Or un ricochet, mécaniquement, c'est une balle qui rebondit sur un autre
# ennemi — c'est-à-dire exactement `chain_targets`. On lui donne donc la
# mécanique de la chaîne : le tag cesse d'être décoratif, et la synergie devient
# atteignable. (Trouvé par le test `every_promised_synergy_is_reachable`.)

