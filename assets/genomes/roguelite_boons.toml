# ═══════════════════════════════════════════════════════════════════════════
# FAMILLE « ENTRETIEN » (2026-08-04) — les atouts qui RENFORCENT le pilier
#
# Toutes les armes sont vivantes et le choix vient de l'ennemi (matchup
# élémentaire, jusqu'à ×2,0). Un atout qui buffe UNE arme casse ce pilier : il
# bat le bon matchup partout et le joueur cesse de changer d'arme.
#
# Ceux-ci ne buffent aucune arme. Ils allongent le temps qu'on peut passer sur
# LA BONNE — c'est le moteur de DOOM Eternal, où la rareté des munitions FORCE
# la rotation. Ils sont donc la seule famille d'atouts d'arme qui serve le
# pilier au lieu de l'éroder.
#
# ⚠️ Dosés MODESTEMENT et fréquents, jamais rares et énormes : en donner trop
# supprime la rotation au lieu de la servir. Il y a un optimum, pas une
# monotonie.
#
# `flat_bonus` additif : deux atouts +25 % donnent +50 %, pas ×1,56. Plus
# lisible, et une pile de doublons n'explose pas.
# ═══════════════════════════════════════════════════════════════════════════

