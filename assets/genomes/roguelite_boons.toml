# Story-529 — Boons Catalogue (Mission 2 GDD)
#
# Hot-reload via Shift+F12 (Bevy Asset). Schema mirroirs
# forgia-rpg-data::boons::BoonsCatalogue.
#
# Champs:
#   id                 : string stable (sert de key Rust `BoonId`)
#   name               : nom affiché (FR cartoon kid-friendly)
#   voiceline_preview  : ligne <5s, vocab CE2 (anti-canon bible v1)
#   rarity             : "common" | "uncommon" | "rare" | "legendary"
#   tags               : ["fire" | "ricochet" | "knockback" | "chain" | "precision" | "chaos"]
#                        3 tags identiques pendant la run → légendaire correspondant unlock
#   weapon_filter      : Optional [string] des weapon_id éligibles, omettre = tous
#   effect.kind        : "damage_mul" | "heal_on_kill" | "fire_rate_mul"
#                      | "chain_targets" | "knockback" | "damage_reduction"
#                      | "flat_bonus"
#
# AC4 Mission 2.3 — 5 boons neutres minimum :
#   1. Éclat d'âme nourrissant   (heal on kill, chaos)
#   2. Métal chaud               (damage_mul, fire)
#   3. Bénédiction de l'Enclume  (damage_reduction, precision)
#   4. Souffle du Maître         (fire_rate_mul, chaos)
#   5. Petit Champignon Lumineux (flat_bonus crit_chance, ricochet)
#
# AC2 — 1 boon par wave clear (3 stages × 3 waves = 9 occasions) + mid-boss.
# AC5 — Légendaires d'exemple (1 par tag clé, unlockés via tag stack ≥3).
#
# Story-558 Phase 2 (2026-05-29) — souls_cost ajouté par boon.
# Defaults rarity-based si omis : Common=20, Uncommon=40, Rare=60, Legendary=80.
# Calibration drop economy : Tank=5, Sniper=3, Runner=2, Boss=40 souls.
# Common pickable après ~4 Tank kills, Legendary après ~16 Tank + Boss.

# ── Poids de tirage par rareté (R3.4, story-645) ────────────────────────
# Un Common sort souvent, un Legendary est un ÉVÉNEMENT. Poids 0 = jamais tiré.
# Hot-reload. Miroir de RarityWeights::default() (boons.rs).
# ── LE SAC (2026-08-04) — la leçon de Dicero ────────────────────────────────
# Nombre d'atouts DISTINCTS portables. C'est la seule chose qui transforme le
# Coffre en arbitrage : sans plafond, tout ajout est gratuit, donc tout choix est
# bon, donc aucun choix n'est intéressant.
#
# ⚠️ Le plafond porte sur les atouts DISTINCTS, pas sur le nombre de prises. Un
# doublon AMÉLIORE ce qu'on porte déjà et ne consomme pas de place — c'est ce qui
# empêche le pool de se diluer, et pourquoi le 8e coffre reste aussi intéressant
# que le 1er.
#
# 6 places : assez pour composer une synergie (seuil légendaire = 3 tags
# identiques) sans que tout tienne dans le sac. Dicero plafonne à 5.
# 0 = illimité (désactive la mécanique, comportement d'avant).
bag_slots = 6

[rarity_weights]
common = 100
uncommon = 45
rare = 18
legendary = 6

