# ── Stance : Rex humanoïde, A-POSE (clavicule penchée = diagonale continue) ───
# 2026-06-05 (soir 5) : la clavicule PENCHÉE est de retour pour l'A-pose. Avant,
# la tourner déformait les écailles de la tête (clavicule influençait ~5887 verts
# dont la nuque/tête). FIX SKINNING fait (forgia-auto-rig::skinning : les verts
# dont l'os le plus proche est tête/nuque excluent les os de bras) → on peut
# pencher la clavicule SANS déformer la tête. Re-rig requis (skinning au rig).
# Diagonale continue : chest→clavicule(40°)→bras(25°, total ≈65°)→main = une seule
# ligne en pente (épaule qui descend, pas de barre « ⊓ »). Le bras hérite de la
# pente clavicule : angle_monde ≈ clavicule_Rz + arm_Rz.
# Tunable :
#   - A-pose plus ouverte (bras + écartés) → ↓ arm (15) / ↑ clavicule (45).
#   - bras + près du corps (vertical) → ↑ arm (35-40).
#   - épaules tombent trop bas → ↓ clavicule (30).
# Le swing du walk reste AVANT-ARRIÈRE. Cf test arm_swing_is_fore_aft_not_twist.
[stance_offsets]
# 2026-06-06 : bras 25→45→52 (total ≈92° = juste passé la verticale) pour COLLER
# le bras au torse — la main converge vers le FLANC (sous l'épaule, un poil rentré).
# Clavicule garde sa pente (épaule diagonale). Tunable : ↑ (55) = encore plus rentré
# (>~60 la main file vers l'entrejambe) ; ↓ (45-50) = plus vertical/écarté.
# ⚠️ Si l'ÉPAULE (haut du bras) reste trop large même rentrée → c'est la LARGEUR
# d'épaule (positions arm_L/R ci-dessus) qu'il faut réduire = re-rig (pas hot-reload).
# ✅ 2026-06-06 (découplage skinning) : on PEUT maintenant resserrer librement les os
# bras. Le skinning (forgia-auto-rig::compute_nearest_bone_weights) exclut désormais les
# os de bras des verts dont l'os le plus proche est tête/nuque (is_head) OU torse/colonne
# (is_body). Donc les verts du buste sont immunisés : resserrer arm_L/clavicle_L ne
# comprime plus le torse. Largeur resserrée clav 0.09 / arm 0.15 / forearm 0.30 pour
# COLLER les coudes au torse (demande user). La frontière deltoïde reste naturelle (les
# verts d'épaule, proche=bras, suivent toujours le bras). Coudes encore trop loin → ↓ arm
# (0.13) ; bras qui clippe DANS le torse → ↑ arm (0.17).
clavicle_l_euler_deg = [0.0, 0.0, 40.0]
clavicle_r_euler_deg = [0.0, 0.0, -40.0]
# 2026-06-06 : 52→48 — l'épaule a été rétrécie (coudes plus rentrés) ; on réduit
# le tuck pour que la main reste au FLANC et ne file pas dans les hanches.
arm_l_euler_deg = [0.0, 0.0, 48.0]
arm_r_euler_deg = [0.0, 0.0, -48.0]
