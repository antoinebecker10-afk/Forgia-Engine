# Template skeleton BipedLizard (Rex) — 17 bones body + 4 tail = 21 bones
# Source de vérité pour `forgia-skeleton-template::SkeletonTemplate`.
# Hot-reloadable via Bevy AssetServer (Shift+F12).
#
# `class` = classification anatomique déclarative (story-481).
#
# 2026-06-04 : retrait de `spine_mid` (4 os spine → 3). Le torse court de Rex ne
# tenait pas 4 os de colonne (hip/spine_lower/spine_mid/chest se superposaient).
# Chaîne réduite : hip → spine_lower (taille, seule vertèbre de flexion) → chest
# (ancre bras/cou). `chest` re-parenté sur `spine_lower`. Indices `parent`
# renumérotés en conséquence. Best practice : on ne garde que les os qu'on pilote
# (la locomotion ne drive qu'un slot `spine`).

[[bones]]
name = "hip"
# 2026-06-04 : z 0.02 → 0.05, bassin avancé "un peu" (demande user).
pos = [0.0, 0.45, 0.05]
class = "spine"

[[bones]]
name = "spine_lower"
parent = 0
pos = [0.0, 0.53, 0.08]
class = "spine"

[[bones]]
name = "chest"
parent = 1
# 2026-06-04 : y 0.71 → 0.74, remonte le point vert chest au niveau des épaules
# (l'embedder place les spine via arc-length t le long du path médial ; y plus
# haut = t plus grand = échantillonne le path plus haut). Reste sous neck (0.76).
pos = [0.0, 0.74, 0.08]
class = "spine"

[[bones]]
name = "neck"
parent = 2
pos = [0.0, 0.76, 0.06]
