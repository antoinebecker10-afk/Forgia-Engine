# Template skeleton BipedLizard (Rex) — humanoïde digitigrade à queue. 25 bones.
# Source de vérité pour `forgia-skeleton-template::SkeletonTemplate`.
# Hot-reloadable via Bevy AssetServer ; re-rig au spawn (OnEnter RPG).
#
# `class` = classification anatomique déclarative (story-481).
# Ordre BFS obligatoire (parent déclaré AVANT l'enfant — cf validate()).
#
# Structure des bras (2026-06-05, best practices MoCap Online / VRChat) :
#   clavicule → upper arm → forearm → main. Rex reste un HUMANOÏDE (bras descendus
#   via [stance_offsets]). NB : les os de bras sont placés de façon DÉTERMINISTE
#   depuis ce template (forgia-skeleton-embedder `is_arm` branch, fix 2026-06-05) —
#   PAS de snap medial axis (qui mettait la clavicule dans le cou → visage déformé).
# Jambe digitigrade : thigh → shin → foot → toe (4 segments raptor).

