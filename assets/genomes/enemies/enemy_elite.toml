# === Constraints ===

# More HP → more XP reward (bigger challenge = bigger reward)
[[constraints]]
source = "elite_max_hp"
target = "elite_xp_reward"
ratio = 0.25

# Higher charge speed → less HP (glass cannon burst)
[[constraints]]
source = "elite_charge_speed_mult"
target = "elite_max_hp"
ratio = -15.0

# Bigger model → more HP + melee range
[[constraints]]
source = "elite_model_scale"
target = "elite_max_hp"
ratio = 40.0

[[constraints]]
source = "elite_model_scale"
target = "elite_melee_range"
ratio = 1.0

# More damage → more gold
[[constraints]]
source = "elite_melee_damage"
target = "elite_gold_reward"
ratio = 2.0
