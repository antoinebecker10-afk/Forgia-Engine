# expedition_arme_main.toml — L'arme TENUE DANS LA MAIN, vue à la 3ᵉ personne.
#
# Chargé en asset `Genome<T>` : il se **recharge à chaud** pendant que le jeu
# tourne (`file_watcher`). C'est délibéré — l'orientation d'une arme dans un
# poing se juge à l'œil, en trois essais, pas dans un tableur. Relancer le jeu
# entre chaque essai transformerait un réglage de deux minutes en une heure.
#
# ── Pourquoi ce fichier n'est pas une section de `viewmodel_arena.toml` ──────
#
# Le viewmodel FPS est accroché à la CAMÉRA : ses offsets sont exprimés dans le
# repère de l'écran (« 22 cm à droite de l'œil, 35 cm dessous »). Ici l'arme est
# accrochée à un OS — `socket_main_droite`, enfant de `RightHand` — donc dans un
# repère qui TOURNE avec l'animation, et que le socket lui-même fait pivoter de
# +90° autour de X.
#
# Les rotations ci-dessous ressemblent à celles du viewmodel parce qu'elles
# décrivent le même fait — l'orientation native de chaque GLB, qui diffère d'une
# arme à l'autre (−90° pour Pépin, +90° pour Lenoir, 180° pour Boucherie). Mais
# elles sont lues dans un AUTRE repère : ce ne sont pas les mêmes nombres, et les
# fusionner ferait diverger l'un quand on règle l'autre.
#
# ── Ce qui NE se déclare pas ici ────────────────────────────────────────────
#
# - **L'échelle** : jamais un facteur en dur sur un GLB importé (`no-hardcode.md`).
#   On déclare la LONGUEUR RÉELLE voulue (`taille_m`) et le moteur mesure l'AABB
#   du maillage chargé pour en dériver le facteur.
# - **La longueur du canon** : elle se déduit de la même AABB, une fois tournée.
#   La bouche est le point le plus avancé du modèle sur son axe de tir.
#   Conséquence utile : si une rotation est fausse, le traceur part visiblement
#   d'ailleurs que du canon. Un seul critère à l'œil valide les deux.

# 🚨 ORDRE — les deux clés de tête viennent AVANT toute table `[...]`.
# En TOML, une clé écrite après une table appartient à cette table : placer
# `cacher_dague` plus bas le rangeait sous `[visee.pose_tactique]`, où il était
# lu comme un os dont la rotation vaudrait `true`. Le fichier entier devenait
# illisible — donc taille, prise, rotations et zooms retombaient tous sur leurs
# défauts, en silence. Attrapé par le test qui lit ce fichier sur le disque.
version = 1

# ═════════════════════════════════════════════════════════════════════════════
# VISER — deux tenues, et un zoom qui dépend de l'arme
# ═════════════════════════════════════════════════════════════════════════════
#
# Au repos le personnage tient son arme **décontracté** : bras bas, canon vers
# le sol. Clic droit maintenu, il passe en **tactique** : arme épaulée, buste
# tourné vers ce qu'il vise. Entre les deux, un fondu.
#
# ── Pourquoi ces poses se DÉCLARENT au lieu de venir d'un clip ──────────────
#
# Le corps d'Expédition porte 9 clips (death, hammer_strike, hit_react, idle,
# jog_backward, jump, run, swim, walk) et **aucun n'est une pose de visée**.
# Attendre un clip « aim » signifierait ne rien livrer. On superpose donc une
# rotation d'os PAR-DESSUS le clip qui joue : le personnage continue de marcher
# et de courir, avec les bras à la bonne place. C'est l'« aim offset » des
# moteurs du marché, et c'est ce qui permet de viser EN COURANT.
#
# Les valeurs sont en degrés, **ajoutées** à ce que l'animation a écrit, et
# rechargées à chaud : elles se règlent à l'œil en trois essais.

[visee]
# Temps pour lever l'arme, et pour la rabaisser. Rabaisser est un peu plus lent :
# lever est une intention, rabaisser un relâchement.
montee_s = 0.16
descente_s = 0.24

# De combien le buste suit le tangage de la caméra quand on vise (0 = pas du
# tout, 1 = entièrement). Ce terme-là n'est PAS une pose figée : il se dérive de
# l'angle réel de la caméra, sinon viser vers le haut ne lèverait pas le canon.
suivi_du_buste = 0.75

# ── Les deux seuils d'ALERTE du capteur d'arme ──────────────────────────────
#
# Écart, en degrés, entre la direction du canon et le regard de la caméra
# ACTIVE — celle qui sert aussi d'origine au tir. 0° = l'arme pointe où on
# regarde ; 180° = elle pointe derrière.
#
# 🚨 Ils vivent ici et pas dans le code parce qu'ils décident d'une ALERTE. Un
# seuil qu'il faut recompiler pour ajuster reste faux : on le contourne au lieu
# de le corriger. Ici ils se rechargent à chaud, donc on peut les resserrer
# pendant qu'on regarde le symptôme à l'écran.
#
# 90° : un quart de tour. Au-delà, le canon a franchi le plan de l'épaule et ne
#       peut plus désigner quoi que ce soit de ce que le personnage regarde.
# 35° : l'écart à partir duquel la lueur de bouche sort visiblement à côté du
#       réticule. Mesuré le 2026-08-16 : 71,7° donnait « les bras dans le dos ».
ecart_alerte_deg = 90.0
ecart_avertit_deg = 35.0

# ── Où vont les MAINS quand on vise ─────────────────────────────────────────
#
# 🚨 Ces quatre nombres ont remplacé douze angles d'Euler par os, et c'est la
# leçon de la journée. Déclarer « le bras droit tourne de −55° autour de X » ne
# marche pas : l'orientation locale d'un os Mixamo ne se devine pas depuis un
# fichier, et l'axe qui lève un bras sur un rig le fait pivoter sur un autre. Au
# 2026-08-16, après trois réglages à l'œil, les bras partaient **dans le dos** et
# le canon s'écartait de 71,7° du regard.
#
# On ne déclare donc plus des ANGLES, on déclare une CIBLE : où la main doit se
# trouver. Le solveur d'IK à deux os (`forgia-ik`) en déduit les angles — et il
# les déduit justes sur n'importe quel squelette, parce qu'il travaille sur les
# positions réelles des os, pas sur une convention supposée.
#
# Tout est exprimé en **fraction de la longueur du bras**, donc valable quel que
# soit le personnage : un chien-guerrier d'1,82 m ou tout autre corps à venir.
[visee.bras]
# 🚨 ÉTEINTE depuis le 2026-08-17, et c'est un choix, pas un abandon.
#
# Le corps porte maintenant `rifle_aim` : une pose de visée CAPTURÉE. Si l'IK
# reste active, deux systèmes écrivent les mêmes quatre os — le clip les met où
# le mocap dit, l'IK les tire vers sa cible calculée. Le plus tardif gagne, et le
# résultat n'est ni l'un ni l'autre.
#
# Une mocap bat une approximation géométrique sur la POSE. Ce qu'elle ne sait pas
# faire, c'est suivre le tangage de la caméra — viser vers le haut : ça reste le
# travail de `suivi_du_buste`, qui touche `Spine2` et pas les bras. Les deux ne se
# disputent donc plus rien.
#
# À rallumer pour un corps SANS clip de visée. Les valeurs ci-dessous restent
# réglées et testées : elles servent le jour où ce cas revient.
actif = false
# 0 = main contre l'épaule · 1 = bras tendu à fond. Coude PLIÉ : 0,72 tendait
# presque le bras, ce qui donne une statue qui présente une arme plutôt que
# quelqu'un qui vise (retour de jeu du 2026-08-17).
portee_avant = 0.62
# Au-dessus de l'épaule (+) ou en dessous (−). À hauteur de poitrine : c'est là
# que la crosse se cale, pas au-dessus de l'épaule.
hauteur = 0.02
# Vers l'axe du corps (−) : l'arme se centre devant le buste. Une arme restée
# sur le côté, c'est quelqu'un qui la porte, pas qui la pointe.
ecart_lateral = -0.18
# La main gauche traverse pour soutenir l'arme. Plus franc qu'avant : à 0,16 elle
# restait à mi-chemin, ce qui ne lit ni comme une prise à deux mains ni comme un
# bras libre.
soutien_lateral = 0.30
# 🚨 CE réglage est celui qui fait la pose. 0 = les deux coudes pendent tout
# droit — la silhouette symétrique et molle de quelqu'un qui TIENT une arme.
# 1 = coude de tir à l'horizontale. Un tireur lève le coude de tir sur le côté
# pour caler la crosse, et garde l'autre bas SOUS l'arme pour la porter : c'est
# l'asymétrie qui vend la pose, pas la hauteur des mains.
coude_ouverture = 0.55

# ── Retouches d'os, pour ce que l'IK ne pilote pas ──────────────────────────
# Les quatre os des bras sont sous IK : les citer ici les ferait se battre avec
# elle. Ce qui reste utile, c'est le buste — il ne vise rien, il s'oriente.
[visee.pose_decontractee]
Spine2 = [0.0, 0.0, 0.0]

[visee.pose_tactique]
# Le buste s'ouvre légèrement vers la cible. S'ajoute au suivi du tangage.
Spine2 = [0.0, -12.0, 0.0]

# ═════════════════════════════════════════════════════════════════════════════
# LA DAGUE du corps — deux défauts d'asset, corrigés ici en attendant Blender
# ═════════════════════════════════════════════════════════════════════════════
#
# Le nœud `SM_Dagger` existe dans le corps et sa TAILLE est juste : 21 cm rendus
# (emprise brute 413 × 2139 × 693, échelle de nœud 1e-4). On n'y touche pas.
#
# Deux choses sont fausses, toutes deux mesurées le 2026-08-16 :
#
# 1. **Sa place** : son nœud porte une translation de **1,39 m** dans le repère
#    de `RightHand`. Elle flotte donc à un mètre quarante de la main. Personne ne
#    l'avait vu parce qu'on la masquait.
# 2. **Sa matière** : matériau `Other`, sans `baseColorTexture` ni couleur — donc
#    une surface blanche mate. Alors que le MÊME fichier contient déjà le jeu
#    `armor_bc` / `armor_n` / `armor_m-armor_r`, utilisé par le matériau `Armor`.
#
# 🚨 C'est un défaut d'ASSET. Sa vraie correction est dans la chaîne Blender
# (`tools/blender/personnage/32` → `37`), pas ici — ce qui suit est un
# rattrapage au chargement, qui laisse l'asset fautif intact. À supprimer le jour
# où la chaîne pose la dague et sa matière correctement.
#
# La main droite tient désormais une arme à feu : la dague va donc **à la
# ceinture**, où elle ne s'interpénètre avec rien. `os` accepte n'importe quel os
# du squelette — c'est ce qui permet de la remettre en main sans toucher au code.

[dague]
visible = true
# Elle ne se masque plus quand on tient une arme : à la ceinture, elle ne gêne
# plus. Repasser à `true` si on la ramène dans la main.
masquer_si_arme_en_main = false
os = "Hips"
# Nom du matériau à lui donner, tel qu'il est écrit dans le GLB du corps. Repris
# par NOM et jamais par index : un index se décale en silence au moindre
# ré-export, un nom manquant se signale.
materiau = "Armor"
# À la hanche droite, légèrement vers l'avant. Valeurs à régler à l'œil — les
# axes locaux d'un os Mixamo ne se devinent pas — et rechargées à chaud.
decalage_x = 0.14
decalage_y = 0.06
decalage_z = 0.10
rotation_x_deg = 0.0
rotation_y_deg = 0.0
rotation_z_deg = 90.0

# ─────────────────────────────────────────────────────────────────────────────
# Les quatre armes. `taille_m` = longueur réelle de l'arme À L'ÉCRAN, pour un
# personnage d'1,82 m. Elle est plus courte qu'en vue subjective : un viewmodel
# est volontairement surdimensionné (il occupe le cadre), une silhouette 3ᵉ
# personne doit rester crédible à côté d'un corps humain.
#
# ── `prise` : OÙ la main tient l'arme ───────────────────────────────────────
#
# 0 = la main tient l'ARRIÈRE (la crosse) · 0,5 = le MILIEU · 1 = l'AVANT.
#
# Ce réglage existe parce que les quatre GLB sont **centrés sur leur origine**
# (mesuré : centre à 0,001 m près, emprise 1,911 m pour les quatre). Sans lui,
# le point d'accroche est donc le milieu de l'arme : la moitié du canon dépasse
# derrière le poing, et l'arme a l'air de flotter autour de la main au lieu
# d'être tenue. C'est le premier retour de jeu, le 2026-08-15.
#
# 0,30 = un tiers depuis l'arrière, là où se trouve la poignée d'une arme à feu.
# ─────────────────────────────────────────────────────────────────────────────

# ── `zoom` : de combien la vue se resserre au clic droit ────────────────────
#
# 1,0 = aucun zoom (on gagne la tenue tactique, pas de la portée optique).
# 1,25 = léger · 2,0 = lunette.
#
# C'est un diviseur du champ de vision : zoom 2 montre deux fois moins large.
# Il ne se règle PAS arme par arme au hasard — il dit ce que l'arme est. Un
# pistolet et un lance-roquettes se pointent, ils ne se lorgnent pas.

# Pépin — pistolet, tenu à une main. 0,36 m : un pistolet un peu généreux, dans
# le style trapu du jeu, mais qui reste un pistolet à côté d'un corps d'1,82 m.
[armes.pepin]
taille_m = 0.36
prise = 0.30
zoom = 1.0
decalage_x = 0.0
decalage_y = 0.0
decalage_z = 0.0
rotation_x_deg = 0.0
rotation_y_deg = -90.0
rotation_z_deg = 0.0

# Bourrasque — le feu nourri, arme d'épaule courte type PM.
[armes.bourrasque]
taille_m = 0.52
prise = 0.30
# Léger : une arme automatique se stabilise, elle ne s'optique pas.
zoom = 1.25
decalage_x = 0.0
decalage_y = 0.0
decalage_z = 0.0
rotation_x_deg = 0.0
rotation_y_deg = -90.0
rotation_z_deg = 0.0

# Madame Lenoir — le sniper : canon long, c'est sa silhouette qui le dit. La
# poignée d'un fusil de précision est plus en arrière que sur une arme courte.
[armes.madame_lenoir]
taille_m = 0.90
prise = 0.25
# La lunette. Plus fort que « léger » : c'est le fusil de précision, sa portée
# utile (300 m) n'a aucun sens si la vue ne se resserre pas vraiment. À baisser
# vers 1,5 si c'est trop en jeu — le fichier se recharge à chaud.
zoom = 2.0
decalage_x = 0.0
decalage_y = 0.0
decalage_z = 0.0
rotation_x_deg = 0.0
rotation_y_deg = 90.0
rotation_z_deg = 0.0

# Boucherie — le lance-roquettes. Il se tient au tiers avant, le tube reposant
# sur l'épaule : d'où une prise plus avancée que les autres.
[armes.boucherie]
taille_m = 0.80
prise = 0.40
# Aucun : un lance-roquettes se pointe. Viser lui donne la tenue tactique et
# rien d'autre — c'est déjà ce qui change le tir.
zoom = 1.0
decalage_x = 0.0
decalage_y = 0.0
decalage_z = 0.0
rotation_x_deg = 0.0
rotation_y_deg = 180.0
rotation_z_deg = 0.0
