[package]
name = "forgia-core"
version = "0.1.0"
edition = "2021"
description = "Forgia V2 — Core types : States, GameSet, Resources globales. 0 dépendance workspace (DAG-libre)."

[lints]
workspace = true

[dependencies]
bevy = { workspace = true }
serde = { workspace = true }

# Story-695 inc.2 : export JS du dump des capteurs (web uniquement).
