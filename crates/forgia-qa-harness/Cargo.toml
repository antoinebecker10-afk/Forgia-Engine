[package]
name = "forgia-qa-harness"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Forgia QA test harness — TestApp builder + property tests (story-391 P5)"

[dependencies]
bevy = { workspace = true }
chrono = { workspace = true }
forgia-qa-core = { workspace = true }
forgia-qa-replay = { workspace = true }
# Feature `golden` : sérialise les SnapshotBundle pour comparaison versionnée.
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# `insta` 1.x : déjà dans forgia-game/dev-dependencies, partagé via cargo. Snapshot
# JSON-redactable, default off pour ne pas peser sur les builds courants.
insta = { version = "1", features = ["json"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.5"

[features]
default = []
qa-runtime = ["forgia-qa-core/qa-runtime"]
# Story-409 : capture/diff déterministe des sensors pour pré-validation des
# refactors observability (story-408) et input (story-410).
# Activer via : cargo test -p forgia-qa-harness --features golden
golden = ["dep:insta", "dep:serde", "dep:serde_json"]
