[package]
name = "forgia-qa-core"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Forgia QA bus typed BugReport + sinks + dedup (story-391 P1)"

[lints]
workspace = true

[dependencies]
bevy = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }
ulid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[features]
default = []
qa-runtime = []
qa-record = []
qa-trace = []
