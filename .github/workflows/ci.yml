name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  # NOTE: RUSTFLAGS=-D warnings supprime ici car cassait les deps 3rd-party
  # (bevy_water, bevy_gauge, bevy_mod_outline emettent leurs propres warnings).
  # Le clippy job applique encore -D warnings sur notre code via `cargo clippy ... -- -D warnings`.

jobs:
  check:
    name: Cargo Check
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  clippy:
    name: Clippy (0 warnings)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Cargo Test (per-crate)
    runs-on: ubuntu-latest
    # story-592 (M0.6) : continue-on-error RETIRE — les 1066 tests bloquent a nouveau.
    # Boucle per-crate au lieu de --workspace : 3 echecs DIFFERENTS observes en
    # workspace build local (artefacts incrementaux/courses), alors que chaque
    # crate testee isolement passe (8 crates validees vertes localement).
    # ubuntu = runner 1x facturation (le job windows 4h x2 a tue le billing).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bevy linux deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - name: Test chaque crate isolement
        run: |
          failed=()
          for c in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name'); do
            echo "::group::cargo test -p $c"
            if ! cargo test -p "$c" --no-fail-fast; then
              failed+=("$c")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Tests en echec dans: ${failed[*]}"
            exit 1
          fi

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  ratchets:
    name: Ratchets (Lock L1 asset-load)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Lock L1 : fail si les call-sites d'asset-load derivent au-dessus de la
      # baseline par fichier (xtask/asset-load-allowlist.toml). story-528.
      - run: cargo xtask asset-load
