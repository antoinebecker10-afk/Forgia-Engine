name: CI

on:
  push:
    branches: [main, master]
    # Budget zero-pay : les pushes docs-only ne consomment AUCUNE minute.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
  pull_request:
    branches: [main, master]
  # Spot-check Windows (plateforme cible) lancé À LA MAIN uniquement (×2 facturation).
  workflow_dispatch:

# Budget zero-pay : un nouveau push annule le run précédent de la même branche
# (pas d'empilement de runs qui brûlent le quota gratuit 2000 min/mois).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # NOTE: RUSTFLAGS=-D warnings supprime ici car cassait les deps 3rd-party
  # (bevy_water, bevy_mod_outline emettent leurs propres warnings).
  # Le clippy job applique encore -D warnings sur notre code via `cargo clippy ... -- -D warnings`.

jobs:
  # Budget zero-pay (2026-06-11) : check+clippy passés windows→ubuntu (×1 au lieu
  # de ×2 facturation — c'est le job windows 4h qui avait épuisé le quota).
  # La plateforme cible Windows reste couverte par : (1) les builds locaux
  # quotidiens (machine dev = Windows), (2) le job windows-check manuel ci-dessous.
  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bevy linux deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - run: cargo check --workspace --all-targets

  clippy:
    name: Clippy (0 warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Bevy linux deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - run: cargo clippy --workspace --all-targets -- -D warnings

  windows-check:
    name: Windows spot-check (manuel)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  test:
    name: Cargo Test (per-crate)
    runs-on: ubuntu-latest
    # story-592 (M0.6) : continue-on-error RETIRE — les 1066 tests bloquent a nouveau.
    # Boucle per-crate au lieu de --workspace : 3 echecs DIFFERENTS observes en
    # workspace build local (artefacts incrementaux/courses), alors que chaque
    # crate testee isolement passe (8 crates validees vertes localement).
    # ubuntu = runner 1x facturation (le job windows 4h x2 a tue le billing).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bevy linux deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - name: Test chaque crate isolement
        run: |
          failed=()
          for c in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name'); do
            echo "::group::cargo test -p $c"
            if ! cargo test -p "$c" --no-fail-fast; then
              failed+=("$c")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Tests en echec dans: ${failed[*]}"
            exit 1
          fi

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  ratchets:
    name: Ratchets (Lock L1 asset-load)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Lock L1 : fail si les call-sites d'asset-load derivent au-dessus de la
      # baseline par fichier (xtask/asset-load-allowlist.toml). story-528.
      - run: cargo xtask asset-load
