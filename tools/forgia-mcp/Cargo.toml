[package]
name = "forgia-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for Forgia — tools and resources for Claude Code"

[[bin]]
name = "forgia-mcp"
path = "src/main.rs"

[[bin]]
name = "forgia-session"
path = "src/session_cli.rs"

[dependencies]
rmcp = { version = "1.2.0", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
schemars = "1"
serde_json = "1"
anyhow = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
