# ──────────────────────────────────────────────────────────────────────────────
# starter_hamlet — Forgia V2 village genome (story-442 PROCGEN V1)
# ──────────────────────────────────────────────────────────────────────────────
#
# Premier hameau procgen reproductible. Generated by `forgia-village-generator`
# from this genome via `LoadVillageGenomeRequest`.
#
# **Édition** : changer `seed` pour obtenir un layout différent, changer
# `target_building_count` pour densité, changer `density` pour spacing.
# Hot-reloadable via Shift+F12 (Bevy file_watcher feature).
#
# **Seed 42** = baseline reproductible — l'IA peut tester sa stabilité avec ce
# seed entre deux sessions / commits.

[meta]
id = "starter_hamlet"
layout_type = "hamlet"      # hamlet | village | capital (capital = unimpl V1)
seed = 42                    # 0 triggers a warning (suspicious uninit)
tier = "standard"            # poor | standard | rich (V1 = visual only)
biome_affinity = ["temperate_forest", "grassland"]

# ──────────────────────────────────────────────────────────────────────────────
# Scale — quantitative size
# ──────────────────────────────────────────────────────────────────────────────

[scale]
# Refonte 2026-05-17 PM — user feedback "spawn trop dense" :
# - bounding_radius 18 → 28 (zone 2.4x plus large)
# - density 0.4 → 0.15 (Poisson min_sep ~4.6m vs 4.0m avant → respiration)
# - target_building_count maintenu à 6 (qualité > quantité)
target_building_count = 6   # generator may place fewer if Poisson fails
density = 0.15               # 0=sparse 1=dense → affects min separation
bounding_radius = 28.0       # world m — all buildings within this circle
unit_scale = 3.5             # KayKit Medieval Hexagon native → player-scale
# Story-446 — Anno/CityEngine validation building-vs-road
road_clearance_m = 2.0       # min m du centerline route (au-delà de half_width)
setback_m = 3.0              # m offset perpendiculaire pour road_anchor pieces
footprint_half_m = 2.5       # building footprint half-extent (Poisson min sep)

# ──────────────────────────────────────────────────────────────────────────────
# Kit mix — which assets, which colors
# ──────────────────────────────────────────────────────────────────────────────

[kit_mix]
kit = "kaykit_medieval_hexagon"
# Weighted color choice — generator picks one per building via weighted_pick.
# V1 PACK LIMITATION : KayKit Medieval Hexagon livré ne contient QUE le variant
# `red/`. Les chemins `blue/` et `yellow/` n'existent pas sur disque → assets
# missing si pondérés. Reverra à 0.7/0.2/0.1 quand pack étendu (story future).
# BUG-446-01 fixé 2026-05-17 nuit.
colors = { red = 1.0 }

# ──────────────────────────────────────────────────────────────────────────────
# Ramparts — V1 désactivé (story-441 v2 : joueur bloqué dans le spawn)
# ──────────────────────────────────────────────────────────────────────────────

[ramparts]
style = "none"               # none | fence_only | partial_wall | full_rampart
gate_count = 1

# ──────────────────────────────────────────────────────────────────────────────
# Buildings — required vs weighted optional pool
# ──────────────────────────────────────────────────────────────────────────────

[buildings]
# Always present, in order. First = center (well anchors the village).
required = ["building_well"]
# Fill remaining slots from this weighted pool. Generator picks via Poisson +
# weighted_pick. Weights are relative (not normalized) — easier to tweak.
optional = { building_tavern = 1.0, building_market = 1.0, building_church = 1.0, building_home_A = 2.0, building_home_B = 2.0 }
# Story-446 — Anno 1800 pattern : buildings publics doivent **toucher** une
# route par leur edge (snap-to-road + perpendicular setback + face the road).
# Tavern/marché/église = bâtiments publics qui doivent ouvrir sur la rue.
# Maisons restent libres (Poisson disc, dispersées).
road_anchored = ["building_tavern", "building_market", "building_church"]

# ──────────────────────────────────────────────────────────────────────────────
# Roads — radials leaving village (count picked from range)
# ──────────────────────────────────────────────────────────────────────────────

[roads]
external_tier = "urban"      # primary | secondary | trail | urban
radial_count_range = [3, 4]  # inclusive [min, max] — generator picks via seed
external_length = 60.0        # m — un peu plus loin pour ouvrir le hub

# ──────────────────────────────────────────────────────────────────────────────
# NPCs — V1 declared but spawner not implemented yet (story-445)
# ──────────────────────────────────────────────────────────────────────────────

[npcs]
density = 0.5                 # NPCs per building (0 = empty, 1 = 1/building)
roles = ["villager", "merchant", "guard"]

[spawn]
local_offset = [3.0, 3.0]     # XZ offset (m) du village center où apparaît le player
yaw_deg = 0.0                  # face +Z (vers le fond du village)

# ──────────────────────────────────────────────────────────────────────────────
# Terrain leveling — story-447 (Niveau A Quick Win)
# ──────────────────────────────────────────────────────────────────────────────
#
# Flatten le heightmap dans un disc autour du village center AVANT chunk meshing.
# Falloff smoothstep en bordure pour transition douce vers le terrain naturel.
# Pattern AAA Skyrim (Burgess GDC 2013) — local flattening disc autour POI.
#
# `radius_m` < `scale.bounding_radius` (28) → laisse de la marge pour foliage
# exclusion disc (~31m) qui reste sur terrain naturel.

[terrain_leveling]
enabled = true
# Tuning 2026-05-18 (story-447 niveau A.5) : sensor sur seed=42 montre 3 buildings
# (tavern, church, home_B outer) à 22-27m du center → ils étaient dans le falloff.
# Élargi radius_m=27 (>26.8m max building distance) + falloff_m=5 (transition rapide
# au-delà). Total influence = 32m > bounding_radius (28). Buildings restent plats,
# roads (gates ~25m) aussi.
# MàJ 2026-06-05 (story-574, audit M9) : relief dramatique (RPG max_height 28→80)
# → gradient ~3x au bord du village. falloff_m 5→25, sinon le smoothstep sur 5m
# pour ~76m de dénivelé crée un mur de soutènement ~60-72°. Total influence = 52m.
# MàJ 2026-06-06 (story-577) : user "la montagne a englouti le spawn". Sample
# heights montrent terrain à 60-87m dans un rayon de 64-181m (vs spawn ~38m) →
# falloff 25m laissait encore un mur dès 52m. falloff_m 25→80 → rampe ~14° sur
# 80m du plateau (38m) vers le relief (~58m@107m), montagnes repoussées en backdrop.
# Foliage/mesh/village/routes appliquent TOUS FlattenZones (pas d'arbres flottants).
# falloff_m est hot-reloadable (Shift+F12) → dialer en live : 50 (montagnes proches)
# à 120 (cuvette large). Pour relief globalement plus doux, voir terrain_shape.toml::max_height.
radius_m = 27.0      # rayon plateau plat — couvre tous les buildings outer-ring
falloff_m = 80.0     # rampe douce plateau→relief (story-577 anti-mur de montagne au spawn)
